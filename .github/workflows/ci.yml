# # =============================================================================
# # .github/workflows/ci.yml — Forge continuous integration
# # =============================================================================
# #
# # This workflow runs the full quality gate on every push and pull
# # request. It is the authoritative definition of "what CI runs" for
# # the Forge repository.
# #
# # # Structure
# #
# # The workflow has three jobs, ordered by fast-fail priority:
# #
# #   drift       — Detects go.mod / go.sum drift. Runs in seconds.
# #   verify      — Runs the reproducibility and integrity checks.
# #                 Runs in a minute or two.
# #   test        — Runs the unit and integration tests. Runs in a
# #                 few minutes.
# #
# # A failure in an earlier job prevents later jobs from running.
# # This is the fast-fail ordering specified in WBS 3.3.1.
# #
# # # Platform matrix
# #
# # The drift job runs only on ubuntu-latest, because drift is
# # deterministic across operating systems. The verify and test jobs
# # run on the full matrix (ubuntu-latest, macos-latest,
# # windows-latest) to catch platform-specific issues.
# #
# # # Go version matrix
# #
# # The verify and test jobs run against both the minimum supported
# # Go version and the current development version, per the version
# # matrix defined in WBS 2.1.2. The drift job runs only against the
# # canonical version, because drift detection is a single-target
# # check.
# #
# # # Caching
# #
# # The Go module cache is cached between runs, keyed on go.sum. This
# # reduces the time to resolve dependencies from minutes to seconds
# # on subsequent runs.
# #
# # # Required status checks
# #
# # The drift job is a required status check for merging to main. See
# # the branch protection specification in
# # docs/development.md "Detecting Dependency Drift".
# # =============================================================================

# name: CI

# # ─────────────────────────────────────────────────────────────────────
# # Triggers
# # ─────────────────────────────────────────────────────────────────────
# #
# # The workflow runs on:
# #
# #   - Every push to main.
# #   - Every pull request targeting main.
# #   - Manual dispatch, for ad-hoc verification.
# #
# # It does not run on every push to feature branches. Contributors
# # who want CI on a feature branch can open a draft pull request.

# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:

# # ─────────────────────────────────────────────────────────────────────
# # Permissions
# # ─────────────────────────────────────────────────────────────────────
# #
# # The workflow requests the minimum permissions it needs. It reads
# # the repository contents and writes nothing.
# #
# # The principle of least privilege applies: a compromised workflow
# # file cannot push commits, create releases, or modify issues.

# permissions:
#   contents: read

# # ─────────────────────────────────────────────────────────────────────
# # Environment
# # ─────────────────────────────────────────────────────────────────────
# #
# # Every job inherits these environment variables. They are the
# # canonical values from docs/dependency-policy.md, section "Module
# # resolution policy".
# #
# # Setting them at the workflow level ensures that every job uses the
# # same environment, regardless of the runner's defaults.

# env:
#   GOFLAGS: -mod=readonly
#   GOTOOLCHAIN: auto
#   GOPROXY: https://proxy.golang.org,direct
#   GOSUMDB: sum.golang.org

