# Reproducibility verification.
#
# Verifies that two builds of the same commit produce byte-identical
# archives. Runs the verifier at cmd/forge-internal-repro, which builds
# each requested platform twice and compares SHA-256.
#
# Triggers:
#
#   pull_request  linux/amd64 only (fast; catches the common regressions)
#   push tags     all six platforms (thorough; a release tag is the
#                 strongest signal that the pipeline must be correct)
#   schedule      all six platforms against main, weekly (catches a
#                 Go toolchain update that changes one platform's output)
#
# The verifier's exit code is the workflow's exit code: 0 when every
# platform reproduced, 1 when any pair differed or a build failed.
#
# See:
#   docs/guides/reproducible-builds.md
#   docs/decisions/ADR-045-reproducibility-posture.md
#   cmd/forge-internal-repro/main.go
name: reproducible

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  schedule:
    # Monday 02:00 UTC. The cron expression uses UTC; GitHub Actions
    # does not allow a timezone in the schedule.
    - cron: "0 2 * * 1"

# Only the checkout is needed. The verifier runs locally; it does not
# upload artifacts, create releases, or push anywhere.
permissions:
  contents: read

# A reproducibility run is deterministic given the same commit and
# toolchain. Serializing runs per-ref avoids two runs of the same commit
# competing for the runner. cancel-in-progress is false: a running
# verifier is cheap and its result is meaningful.
concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # matrix
  #
  # Selects the platforms to verify. The selection depends on the
  # trigger:
  #
  #   pull_request  linux/amd64 only
  #   push tags     all six platforms from docs/reference/platforms.yaml
  #   schedule      all six platforms from docs/reference/platforms.yaml
  #
  # The platform list is generated by cmd/forge-internal-platform, so
  # platforms.yaml remains the single source of truth. Adding a Tier 2
  # platform automatically extends the tag and schedule runs.
  # ─────────────────────────────────────────────────────────────────────────
  matrix:
    name: Select platforms
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - id: gen
        name: Compute the platform list
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # One platform is enough to catch the common regressions:
              # a reintroduced time.Now(), a missing -buildid=, an
              # archive timestamp that comes from the filesystem.
              echo 'include={"include":[{"goos":"linux","goarch":"amd64"}]}' >> "$GITHUB_OUTPUT"
              ;;
            push|schedule)
              # Every Tier 1 and Tier 2 platform.
              out=$(go run ./cmd/forge-internal-platform --format=gha-matrix)
              echo "include=$out" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unhandled trigger: ${{ github.event_name }}"
              exit 1
              ;;
          esac

  # ─────────────────────────────────────────────────────────────────────────
  # verify
  #
  # Runs the verifier once per platform in the matrix. Each job:
  #
  #   1. Checks out the repo with full history (fetch-depth: 0) so
  #      `git log -1 --format=%ct` works.
  #   2. Installs Go from go.mod's toolchain directive.
  #   3. Sets SOURCE_DATE_EPOCH from the commit's committer timestamp.
  #   4. Runs cmd/forge-internal-repro, which builds the platform twice
  #      and compares SHA-256.
  #
  # fail-fast: false so one platform's failure does not hide another's.
  # The final report is more useful if every platform is attempted.
  # ─────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for git log -1 --format=%ct. A
          # shallow checkout still has the single commit, but full
          # history is the safe default and it is cheap for Forge's
          # repository size.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
          # cache: true is the default; the go.sum in the repo is the
          # cache key. Cross-compilation builds the same module graph
          # for every platform, so the cache is shared across jobs.
          cache: true

      - name: Set SOURCE_DATE_EPOCH from the commit
        run: |
          set -euo pipefail
          sde=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$sde" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$sde ($(date -u -d "@$sde" +%Y-%m-%dT%H:%M:%SZ))"

      - name: Verify reproducibility of ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go run ./cmd/forge-internal-repro \
            --os=${{ matrix.goos }} \
            --arch=${{ matrix.goarch }} \
            --verbose

  # ─────────────────────────────────────────────────────────────────────────
  # summary
  #
  # A single job that depends on every verify job. Its only purpose is
  # to give the workflow a stable check name for branch protection:
  # "reproducible" instead of "Verify linux/amd64", which changes as
  # the matrix changes.
  #
  # It fails if any verify job failed. The needs context exposes the
  # result of each dependency; the check is a simple any-failed.
  # ─────────────────────────────────────────────────────────────────────────
  summary:
    name: reproducible
    needs: verify
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Report
        run: |
          set -euo pipefail
          result="${{ needs.verify.result }}"
          case "$result" in
            success)
              echo "OK: every platform reproduced byte-for-byte"
              ;;
            failure)
              echo "::error::at least one platform failed reproducibility"
              exit 1
              ;;
            cancelled)
              echo "::warning::the verify job was cancelled"
              exit 1
              ;;
            *)
              echo "::error::unexpected verify result: $result"
              exit 1
              ;;
          esac