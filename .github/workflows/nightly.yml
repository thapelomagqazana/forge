# nightly.yml — scheduled long-running workflow.
#
# Purpose: run the checks that are too slow for every PR: fuzz for one hour,
# the race detector over the full suite, and the matrix expansion across all
# Tier 1 and Tier 2 platforms.
#
# Required checks: none. Advisory only.
#
# Ownership: Release Engineering.
#
# Permissions: contents: read. Nothing else.
#
# Timeouts: every job declares an explicit `timeout-minutes`. The value
# is a backstop against a hung runner, not a budget enforcement. The
# flake contract test TestFlake_EveryJobHasTimeout asserts the field is
# present on every job in every workflow.

name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz for one hour
        run: |
          go test ./internal/... -run=^$ -fuzz=Fuzz -fuzztime=1h

  race-full:
    name: race-full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=2 ./...

  matrix:
    name: matrix-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...