# =============================================================================
# dependabot.yml — automated dependency update detection for Forge
# =============================================================================
#
# This configuration enables Dependabot to open pull requests when a
# new version of a dependency is available, or when a security advisory
# is published against the currently pinned version.
#
# The configuration enforces two policies at the tooling layer:
#
#   1. docs/dependency-policy.md (Go modules)
#
#      - Patch updates are grouped into a single weekly PR.
#      - Minor and major updates open one PR per dependency, so the
#        review checklist in Section 2 of the policy is tractable for
#        each PR.
#      - Pull requests are labelled by upgrade category (patch, minor,
#        major, security). The label tells the reviewer which process
#        applies (ADR-light for patch, full ADR for minor/major,
#        expedited for security).
#      - A "dependencies" label is added to every Dependabot PR so that
#        reviewers can filter the PR queue.
#      - The commit message includes the dependency name and the
#        version range, so the PR title is self-describing.
#
#   2. ADR-043 (CI Workflow Architecture — pinned actions)
#
#      Every `uses:` in .github/workflows/ references a full
#      40-hex-character SHA. Dependabot is the mechanism that keeps
#      those pins current. The github-actions ecosystem is configured
#      to group every action update into a single weekly PR: an action
#      pin is a one-line diff, and a single grouped PR is easier to
#      review than ten one-line PRs.
#
# See: https://docs.github.com/en/code-security/dependabot
# See: docs/dependency-policy.md
# See: docs/decisions/ADR-043-ci-workflow-architecture.md
# =============================================================================

version: 2

updates:
  # ─────────────────────────────────────────────────────────────────────
  # Go modules
  # ─────────────────────────────────────────────────────────────────────
  #
  # Scans go.mod for dependencies. Patch updates are grouped into a
  # single PR; minor and major updates open one PR per dependency.
  #
  # The Go toolchain is one of two ecosystems configured. When Forge
  # adds other ecosystems (npm for documentation tooling, for example),
  # additional entries are added here.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      # Weekly on Monday at 06:00 UTC. This is a low-traffic time and
      # matches the quarterly review cadence in the policy (each
      # weekly check is a lightweight filter; the quarterly review is
      # the substantive analysis).
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    # Five open PRs is the ceiling for the Go ecosystem: one grouped
    # patch PR plus up to four individual minor/major PRs. A backlog
    # larger than that means the reviewer is not keeping up and
    # Dependabot should slow down rather than pile on.
    open-pull-requests-limit: 5

    # Labels applied to every PR from this configuration. The labels
    # tell the reviewer which process in the policy applies.
    labels:
      - "dependencies"
      - "go"

    # Do not allow Dependabot to rebase its own PRs. The reviewer
    # prefers to see the state the PR was opened in and to rebase
    # explicitly when appropriate. This is a deliberate choice for the
    # Go ecosystem, where a rebase can pull in unrelated go.sum
    # churn that obscures the actual dependency change.
    rebase-strategy: "disabled"

    # Commit message format. The prefix is a Conventional Commits
    # type; the body names the dependency and the version change.
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    # Group patch updates only. Minor and major updates require an ADR
    # per the policy, and grouping them would obscure the individual
    # ADR requirement. Security updates are not grouped: GitHub's
    # security advisory feed opens its own PRs, labelled `security`,
    # and the expedited process in the policy applies.
    groups:
      patch-updates:
        applies-to: "version-updates"
        update-types:
          - "patch"

    # Ignore major and minor updates to the Go toolchain itself. The
    # toolchain is managed via the `go` and `toolchain` directives in
    # go.mod, not by Dependabot. Patch updates to the `go` directive
    # are also ignored because the policy treats a toolchain change as
    # a deliberate, scheduled decision.
    ignore:
      - dependency-name: "go"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # ─────────────────────────────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────────────────────────────
  #
  # Scans .github/workflows/ for `uses:` references and opens a PR
  # when the pinned SHA is superseded by a newer release of the action.
  #
  # This entry is the mechanism that keeps the pinned-action policy in
  # ADR-043 sustainable. Without it, the policy would be a one-time
  # snapshot: the SHAs would be pinned on the day they were written and
  # would drift as upstream actions released security fixes.
  #
  # The `patterns: ["*"]` group collapses every action update into a
  # single weekly PR. The rationale:
  #
  #   - An action pin is a one-line diff. A reviewer can read ten of
  #     them in the time it takes to read one minor Go dependency
  #     update, because the only thing to verify is that the SHA
  #     resolves to the expected tag in the upstream repository.
  #
  #   - A grouped PR is a single CI run. Ten separate PRs would be
  #     ten CI runs, which is ten times the compute for the same
  #     review.
  #
  #   - A grouped PR is a single changelog entry in the release notes.
  #     Ten separate PRs would clutter the release notes with
  #     dependency noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    # One grouped PR per week. If the previous week's grouped PR is
    # still open, Dependabot waits until it is merged rather than
    # opening a second. This is the correct behaviour: the reviewer
    # should not face a backlog of grouped PRs.
    open-pull-requests-limit: 1

    # Labels. `dependencies` is the filter label; `ci` routes the PR
    # to Release Engineering, the owner of the workflow files.
    labels:
      - "dependencies"
      - "ci"

    # Default rebase strategy. Unlike the Go ecosystem, an action pin
    # is a one-line change with no go.sum churn, so an automatic
    # rebase does not obscure the diff. Rebasing keeps the grouped PR
    # mergeable without manual intervention.
    #
    # rebase-strategy is deliberately not set; the default applies.

    # Commit message format. The prefix is a Conventional Commits
    # type; the scope is the ecosystem, so the PR list is filterable
    # by `chore(ci)` in the commit log.
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

    # Group every action update into a single weekly PR. The group
    # name is a label in the PR body; it does not appear in the commit
    # message. The patterns list is `*` because every action is
    # subject to the same pinning policy and the same review process.
    groups:
      github-actions:
        patterns:
          - "*"