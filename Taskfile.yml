# =============================================================================
# Taskfile.yml — Forge engineering workflow
# =============================================================================
#
# This is the canonical entry point for every routine operation on the Forge
# repository. Contributors should not need to memorise raw `go`, `git`, or
# shell commands; every routine operation has a named task.
#
# Run `task --list` to see all available tasks.
#
# Structure:
#
#   adr:*                — Architecture Decision Record management
#   hooks:*              — Local Git hooks management (WBS 2.6.1)
#   module:*             — Go module verification (WBS 2.1.1)
#   goversion:*          — Go version matrix verification (WBS 2.1.2)
#   verify:*             — Composed verification namespaces
#     verify:reproducible  — Reproducibility invariant (WBS 2.3.1)
#     verify:cobra         — Cobra pin and wiring (WBS 2.4.1)
#     verify:deps          — Dependency policy enforcement (WBS 2.5.1)
#   lint:*               — Linting (Markdown, and future linters)
#   tidy                 — Dependency lockfile maintenance (maintainers only)
#   build:*              — Binary compilation with injected metadata
#   test                 — Fast unit tests
#   test:integration     — Process-boundary integration tests
#   fmt*                 — Go formatting
#   vet                  — Static analysis
#   check                — Full quality gate
#   verify               — Composition of all verify:* tasks
#   clean                — Remove build artifacts
#   default              — List all tasks
#
# Conventions:
#
#   - Every task sets `dir: "{{.USER_WORKING_DIR}}"` so tasks work from any
#     subdirectory of the repository.
#   - Multi-step shell logic uses `set -euo pipefail` to fail fast.
#   - Verification tasks print `OK:` on success and `FAIL:` on failure so
#     CI logs are greppable.
#   - Internal helpers are marked `internal: true` and must not be invoked
#     directly by contributors.
#   - Checks that invoke commands containing Go template syntax
#     (`go list -m -f '{{...}}'`) live in scripts/ rather than inline.
#     Task parses `cmds:` blocks as Go templates, and the two template
#     syntaxes collide when inlined.
# =============================================================================

version: '3'

# =============================================================================
# Variables
# =============================================================================
#
# These variables are computed once per task invocation. Several shell
# invocations (`git describe`, `git rev-parse`, `date -u`) tolerate failure
# by falling back to a default, so that a fresh clone without tags still
# produces a valid build.
# =============================================================================

vars:

  # ───────────────────────────────────────────────────────────────────────────
  # ADR configuration
  # ───────────────────────────────────────────────────────────────────────────
  ADR_DIR: docs/decisions
  ADR_TEMPLATE: "{{.ADR_DIR}}/template.md"
  ADR_SCRIPTS: scripts/adr

  # ───────────────────────────────────────────────────────────────────────────
  # Module configuration (WBS 2.1.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # MODULE must match go.mod exactly. The `module:verify:path` task enforces
  # this at CI time. If you change the module path, change it in both places
  # in the same commit.
  #
  # VERSION_PKG is the linker injection target (see WBS 6.1.2). It must
  # resolve to a real package once `internal/version/` exists.
  MODULE: 'github.com/thapelomagqazana/forge'
  VERSION_PKG: '{{.MODULE}}/internal/version'

  # ───────────────────────────────────────────────────────────────────────────
  # Go version matrix (WBS 2.1.2)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # These values mirror the frozen matrix in docs/development.md and
  # ADR-004-go-version-matrix.md. They are consumed by the
  # `goversion:verify:*` tasks.
  #
  # When the matrix is intentionally changed (via an ADR that supersedes
  # ADR-004), update these three values, go.mod, and docs/development.md
  # in the same commit.
  #
  #   GO_MIN     — Minimum supported version (the contract)
  #   GO_DEV     — Current development version (the recommended toolchain)
  #   GO_LATEST  — Latest supported version (tested in CI)
  #
  # Do NOT use `latest` as a value. The policy is to pin exact versions
  # so that behaviour is reproducible across contributors and CI runs.
  GO_MIN: '1.23.0'
  GO_DEV: '1.23.4'
  GO_LATEST: '1.24'

  # ───────────────────────────────────────────────────────────────────────────
  # Reproducibility configuration (WBS 2.3.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # GOFLAGS_REQUIRED — the value that GOFLAGS must contain for reproducible
  # builds. It is checked by verify:reproducible:env.
  #
  # GOTOOLCHAIN_REQUIRED — the value that GOTOOLCHAIN must be set to. It
  # allows Go to honour the `toolchain` directive in go.mod.
  #
  # Both values are also documented in docs/development.md, so that
  # contributors can set them in their shell profiles.
  GOFLAGS_REQUIRED: '-mod=readonly'
  GOTOOLCHAIN_REQUIRED: 'auto'

  # ───────────────────────────────────────────────────────────────────────────
  # Dependency policy configuration (WBS 2.5.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # DEP_POLICY — path to the dependency policy document. Checked for
  # existence by verify:deps:documented.
  #
  # DEP_ALLOWED_DIRECT — the exact set of direct dependencies permitted in
  # Phase 2, one module path per line. Any change to this set requires
  # updating this variable AND adding a registry entry to the policy
  # document. The two changes must be made in the same commit.
  #
  #   Phase 2 permits exactly one direct dependency: Cobra.
  #   The list grows as future WBS items introduce dependencies.
  DEP_POLICY: 'docs/dependency-policy.md'
  DEP_ALLOWED_DIRECT: 'github.com/spf13/cobra'

  # ───────────────────────────────────────────────────────────────────────────
  # Markdown lint configuration (WBS 2.1.x — documentation quality)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # MD_GLOB — the set of Markdown files to lint.
  #
  # The glob intentionally excludes generated documentation under dist/
  # and any build output. It intentionally includes:
  #
  #   - docs/            (all specification and reference documents)
  #   - *.md at root     (README, CONTRIBUTING, SECURITY, etc.)
  #   - cmd/**/README.md (per-command documentation)
  #   - internal/**/*.md (package-level documentation)
  #   - scripts/**/*.md  (tooling documentation)
  #
  # MD_CONFIG — path to the markdownlint configuration file.
  #
  # The configuration is authoritative; see .markdownlint.yaml for the
  # rationale behind each enabled or disabled rule.
  MD_GLOB: '**/*.md'
  MD_CONFIG: '.markdownlint.yaml'

  # ───────────────────────────────────────────────────────────────────────────
  # Build metadata (injected at link time)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # VERSION: git describe with tags, or "dev" on a fresh clone.
  # COMMIT:  short SHA of HEAD, or "none" outside a git repository.
  # BUILD_DATE: RFC 3339 UTC, always safe to compute.
  # DIRTY:   "true" if the working tree has uncommitted changes, else "false".
  VERSION:
    sh: 'git describe --tags --always --dirty 2>/dev/null || echo dev'
  COMMIT:
    sh: 'git rev-parse --short HEAD 2>/dev/null || echo none'
  BUILD_DATE:
    sh: 'date -u +%Y-%m-%dT%H:%M:%SZ'
  DIRTY:
    sh: 'test -n "$(git status --porcelain 2>/dev/null)" && echo true || echo false'

  # Linker flags passed to `go build -ldflags "..."`.
  LDFLAGS: >-
    -X {{.VERSION_PKG}}.Value={{.VERSION}}
    -X {{.VERSION_PKG}}.Commit={{.COMMIT}}
    -X {{.VERSION_PKG}}.BuildDate={{.BUILD_DATE}}
    -X {{.VERSION_PKG}}.Dirty={{.DIRTY}}

# =============================================================================
# Tasks
# =============================================================================

tasks:

  # ───────────────────────────────────────────────────────────────────────────
  # Default
  # ───────────────────────────────────────────────────────────────────────────
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ═══════════════════════════════════════════════════════════════════════════
  # ADR — Architecture Decision Record management
  # ═══════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────
  # Create a new ADR
  # ─────────────────────────────────────────────────────────────
  adr:new:
    desc: "Create a new ADR: task adr:new -- 'Decision title'"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: test -d {{.ADR_DIR}}
        msg: "ADR directory does not exist: {{.ADR_DIR}}"
      - sh: test -f {{.ADR_TEMPLATE}}
        msg: "ADR template does not exist: {{.ADR_TEMPLATE}}"
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Usage: task adr:new -- 'Decision title'"
    cmds:
      - task: adr:_create
        vars:
          TITLE: '{{.CLI_ARGS}}'
      - task: adr:index

  # Internal: do not call directly
  adr:_create:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/new.sh {{.ADR_DIR}} "{{.TITLE}}"

  # ─────────────────────────────────────────────────────────────
  # Supersede an existing ADR
  # ─────────────────────────────────────────────────────────────
  adr:supersede:
    desc: "Supersede an old ADR: task adr:supersede -- 'old-number' 'new-title'"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: test -n "{{index .CLI_ARGS 0}}"
        msg: "Usage: task adr:supersede -- 'old-number' 'new-title'"
      - sh: test -n "{{index .CLI_ARGS 1}}"
        msg: "Usage: task adr:supersede -- 'old-number' 'new-title'"
    cmds:
      - task: adr:_supersede
        vars:
          OLD_NUM: '{{index .CLI_ARGS 0}}'
          NEW_TITLE: '{{index .CLI_ARGS 1}}'
      - task: adr:index

  # Internal: do not call directly
  adr:_supersede:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/supersede.sh {{.ADR_DIR}} "{{.OLD_NUM}}" "{{.NEW_TITLE}}"

  # ─────────────────────────────────────────────────────────────
  # Regenerate the index (called by adr:new and adr:supersede)
  # ─────────────────────────────────────────────────────────────
  adr:index:
    desc: Regenerate the ADR index
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/index.sh {{.ADR_DIR}}

  # ─────────────────────────────────────────────────────────────
  # List ADRs (optional status filter)
  # ─────────────────────────────────────────────────────────────
  adr:list:
    desc: "List ADRs: task adr:list [-- --status=Proposed]"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/list.sh {{.ADR_DIR}} {{.CLI_ARGS}}

  # ─────────────────────────────────────────────────────────────
  # Lint ADRs (format completeness; usable in CI)
  # ─────────────────────────────────────────────────────────────
  adr:lint:
    desc: Check all ADRs for format completeness
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/lint.sh {{.ADR_DIR}}

  # ═══════════════════════════════════════════════════════════════════════════
  # Hooks — local Git hooks management (WBS 2.6.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # The hooks live in .githooks/ and are versioned with the repository.
  # The tasks below install, uninstall, and inspect them in the local
  # clone by setting core.hooksPath.
  #
  # Hooks run the same tasks that CI runs. See .githooks/README.md for
  # the full documentation.
  # ═══════════════════════════════════════════════════════════════════════════

  hooks:install:
    desc: Install the Forge Git hooks into the local clone (run once)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/install-hooks.sh

  hooks:uninstall:
    desc: Remove the Forge Git hooks from the local clone
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - git config --unset core.hooksPath || true
      - echo "OK - hooks uninstalled"

  hooks:status:
    desc: Report whether the Forge Git hooks are installed
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        current=$(git config --get core.hooksPath 2>/dev/null || echo "")
        if [ "$current" = ".githooks" ]; then
          echo "OK: hooks installed (core.hooksPath = .githooks)"
        else
          echo "WARN: hooks not installed (core.hooksPath = ${current:-unset})"
          echo "      Run 'task hooks:install' to install them."
        fi

  hooks:test:
    desc: Run the pre-commit checks without creating a commit
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh .githooks/pre-commit

  hooks:test:push:
    desc: Run the pre-push checks without pushing
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh .githooks/pre-push

  # ═══════════════════════════════════════════════════════════════════════════
  # Module — verification of go.mod configuration (WBS 2.1.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # module:verify composes every acceptance criterion from WBS 2.1.1 into a
  # single command. CI should call this task; contributors should call it
  # before committing changes to go.mod.
  #
  # The composed sub-tasks are also callable individually for debugging.
  # ═══════════════════════════════════════════════════════════════════════════

  module:verify:
    desc: Verify the Go module is correctly configured (WBS 2.1.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: module:verify:exists
      - task: module:verify:path
      - task: module:verify:lowercase
      - task: module:verify:matches-url
      - task: module:verify:builds
      - task: module:verify:tidy

  # AC1 — go.mod exists at repository root.
  module:verify:exists:
    desc: Confirm go.mod exists at repository root
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if [ ! -f go.mod ]; then
          echo "FAIL: go.mod missing at repository root" >&2
          exit 1
        fi
        echo "OK: go.mod exists"

  # AC2 — Module path matches the canonical value declared in Taskfile vars.
  module:verify:path:
    desc: Confirm the module directive matches the canonical path
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        actual=$(grep -E '^module ' go.mod | awk '{print $2}')
        if [ "$actual" != "{{.MODULE}}" ]; then
          echo "FAIL: module path mismatch" >&2
          echo "  expected: {{.MODULE}}" >&2
          echo "  actual:   $actual" >&2
          exit 1
        fi
        echo "OK: module path = $actual"

  # AC3 — Module path contains no uppercase letters.
  module:verify:lowercase:
    desc: Confirm the module path contains no uppercase letters
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        path=$(grep -E '^module ' go.mod | awk '{print $2}')
        if echo "$path" | grep -qE '[A-Z]'; then
          echo "FAIL: module path contains uppercase letters: $path" >&2
          exit 1
        fi
        echo "OK: module path is lowercase"

  # Soft check — module path versus git remote URL.
  # This is a warning, not a failure, because the git remote may not yet be
  # canonical (e.g. before the repository is published to GitHub).
  module:verify:matches-url:
    desc: Confirm the module path matches the GitHub repository URL (warning only)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        mod=$(grep -E '^module ' go.mod | awk '{print $2}')
        remote=$(git config --get remote.origin.url 2>/dev/null || echo "")
        remote_normalised=$(echo "$remote" \
          | sed -E 's#^git@([^:]+):#\1/#' \
          | sed -E 's#^https?://##' \
          | sed -E 's#\.git$##')
        if [ -n "$remote_normalised" ] && [ "$remote_normalised" != "$mod" ]; then
          echo "WARN: module path ($mod) differs from git remote ($remote_normalised)" >&2
          echo "      Acceptable if the remote URL is not yet canonical." >&2
        else
          echo "OK: module path matches git remote"
        fi

  # AC4 — go build ./... exits 0.
  # On a module with no packages, this is a successful no-op.
  module:verify:builds:
    desc: Confirm go build ./... succeeds (no-op when no packages exist)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go build ./...
      - echo "OK - go build succeeded"

  # AC5 — go mod tidy produces no diff on a clean checkout.
  # On a module with no dependencies, this is a no-op.
  module:verify:tidy:
    desc: Confirm go mod tidy produces no diff on a clean checkout
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        go mod tidy
        if ! git diff --quiet -- go.mod go.sum 2>/dev/null; then
          echo "FAIL: go mod tidy produced changes" >&2
          git diff -- go.mod go.sum
          exit 1
        fi
        echo "OK: go.mod is tidy"

  # ═══════════════════════════════════════════════════════════════════════════
  # Go version matrix — verification (WBS 2.1.2)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # goversion:verify composes every acceptance criterion from WBS 2.1.2 into
  # a single command. CI should call this task; contributors should call it
  # before committing changes to go.mod or docs/development.md.
  #
  # The composed sub-tasks are also callable individually for debugging.
  # ═══════════════════════════════════════════════════════════════════════════

  goversion:verify:
    desc: Verify the Go version matrix is documented and enforced (WBS 2.1.2)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: goversion:verify:go-directive
      - task: goversion:verify:toolchain-directive
      - task: goversion:verify:no-latest
      - task: goversion:verify:matrix-documented
      - task: goversion:verify:minimum-builds

  # AC1 — go.mod contains an explicit `go` directive matching the frozen
  # minimum supported version (GO_MIN).
  goversion:verify:go-directive:
    desc: Confirm go.mod contains an explicit go directive
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if ! grep -qE '^go [0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod; then
          echo "FAIL: go.mod has no valid 'go' directive" >&2
          exit 1
        fi
        actual=$(grep -E '^go ' go.mod | awk '{print $2}')
        if [ "$actual" != "{{.GO_MIN}}" ]; then
          echo "FAIL: go directive does not match frozen minimum" >&2
          echo "  expected: {{.GO_MIN}}" >&2
          echo "  actual:   $actual" >&2
          exit 1
        fi
        echo "OK: go directive = $actual"

  # AC1 (companion) — go.mod contains an explicit `toolchain` directive
  # matching the frozen development version (GO_DEV).
  goversion:verify:toolchain-directive:
    desc: Confirm go.mod contains an explicit toolchain directive
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if ! grep -qE '^toolchain go[0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod; then
          echo "FAIL: go.mod has no valid 'toolchain' directive" >&2
          exit 1
        fi
        actual=$(grep -E '^toolchain ' go.mod | awk '{print $2}')
        expected="go{{.GO_DEV}}"
        if [ "$actual" != "$expected" ]; then
          echo "FAIL: toolchain directive does not match frozen development version" >&2
          echo "  expected: $expected" >&2
          echo "  actual:   $actual" >&2
          exit 1
        fi
        echo "OK: toolchain directive = $actual"

  # AC2 — no use of `latest` anywhere in go.mod.
  goversion:verify:no-latest:
    desc: Confirm go.mod does not use 'latest' anywhere
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if grep -qE 'latest' go.mod; then
          echo "FAIL: go.mod contains 'latest' (forbidden)" >&2
          grep -n 'latest' go.mod >&2
          exit 1
        fi
        echo "OK: no 'latest' in go.mod"

  # AC3 — docs/development.md documents all three version roles.
  goversion:verify:matrix-documented:
    desc: Confirm docs/development.md documents the three-tier version matrix
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        file="docs/development.md"
        if [ ! -f "$file" ]; then
          echo "FAIL: $file is missing" >&2
          exit 1
        fi
        for phrase in "Minimum supported" "Current development" "Latest supported"; do
          if ! grep -q "$phrase" "$file"; then
            echo "FAIL: $file does not document '$phrase'" >&2
            exit 1
          fi
        done
        echo "OK: version matrix documented in $file"

  # AC5 — the minimum supported version can build the module.
  # On a module with no packages, this is a successful no-op. On a module
  # with packages, this ensures no feature from a newer Go version has
  # leaked into the source.
  goversion:verify:minimum-builds:
    desc: Confirm the minimum supported Go version builds the module
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        echo "Building with GOTOOLCHAIN=go{{.GO_MIN}} ..."
        GOTOOLCHAIN=go{{.GO_MIN}} go build ./...
        echo "OK: builds with Go {{.GO_MIN}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Reproducibility — verification of the module and toolchain contract
  # (WBS 2.3.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify:reproducible proves that the local environment satisfies the
  # reproducibility invariant. It is safe to run at any time and makes no
  # changes to the working tree (sub-tasks that need to temporarily modify
  # files use a backup-and-restore pattern that is exception-safe).
  #
  # verify:reproducible:negative proves that -mod=readonly actually
  # prevents mutation. It temporarily modifies a copy of go.mod in a temp
  # directory and asserts that the build fails. The working tree is never
  # modified.
  #
  # CI should call verify:reproducible; contributors should call it before
  # opening a pull request. It is also included in the `check` composed
  # task.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:reproducible:
    desc: Verify the reproducibility invariant holds locally (WBS 2.3.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:reproducible:env
      - task: verify:reproducible:tidy
      - task: verify:reproducible:lockstep
      - task: verify:reproducible:negative

  # AC3 — Verify that GOFLAGS and GOTOOLCHAIN are set as required.
  verify:reproducible:env:
    desc: Confirm GOFLAGS and GOTOOLCHAIN are set as required
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        flags=$(go env GOFLAGS)
        toolchain=$(go env GOTOOLCHAIN)

        if ! echo "$flags" | grep -q -- "{{.GOFLAGS_REQUIRED}}"; then
          echo "FAIL: GOFLAGS does not include {{.GOFLAGS_REQUIRED}}" >&2
          echo "  actual GOFLAGS: $flags" >&2
          echo "  See docs/development.md for setup instructions." >&2
          exit 1
        fi

        if [ "$toolchain" != "{{.GOTOOLCHAIN_REQUIRED}}" ] && \
           [ "$toolchain" != "local" ]; then
          echo "FAIL: GOTOOLCHAIN is not '{{.GOTOOLCHAIN_REQUIRED}}' or 'local'" >&2
          echo "  actual GOTOOLCHAIN: $toolchain" >&2
          exit 1
        fi

        echo "OK: GOFLAGS=$flags GOTOOLCHAIN=$toolchain"

  # AC3 (continued) — Verify that go mod tidy produces no diff.
  #
  # Uses a backup-and-restore pattern that is exception-safe: if the
  # command fails for any reason, the backup is restored.
  verify:reproducible:tidy:
    desc: Confirm go mod tidy produces no diff on a clean checkout
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        # Back up the lockfiles with a trap that restores on any exit.
        backup_dir=$(mktemp -d)
        trap 'cp "$backup_dir/go.mod.bak" go.mod 2>/dev/null || true; \
              [ -f "$backup_dir/go.sum.bak" ] && cp "$backup_dir/go.sum.bak" go.sum 2>/dev/null || true; \
              rm -rf "$backup_dir"' EXIT

        cp go.mod "$backup_dir/go.mod.bak"
        [ -f go.sum ] && cp go.sum "$backup_dir/go.sum.bak"

        go mod tidy

        if ! diff -q "$backup_dir/go.mod.bak" go.mod >/dev/null 2>&1; then
          echo "FAIL: go mod tidy modified go.mod" >&2
          echo "  Run 'task tidy' on a clean branch to update." >&2
          diff "$backup_dir/go.mod.bak" go.mod >&2 || true
          exit 1
        fi

        if [ -f "$backup_dir/go.sum.bak" ] && \
           ! diff -q "$backup_dir/go.sum.bak" go.sum >/dev/null 2>&1; then
          echo "FAIL: go mod tidy modified go.sum" >&2
          exit 1
        fi

        echo "OK: go.mod and go.sum are tidy"

  # AC3 (continued) — Verify that go list -m all is deterministic across
  # consecutive invocations.
  verify:reproducible:lockstep:
    desc: Confirm module resolution is deterministic across runs
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        run1=$(go list -m all 2>/dev/null | sort)
        run2=$(go list -m all 2>/dev/null | sort)
        if [ "$run1" != "$run2" ]; then
          echo "FAIL: go list -m all produced different output across runs" >&2
          diff <(echo "$run1") <(echo "$run2") >&2 || true
          exit 1
        fi
        echo "OK: module resolution is deterministic"

  # AC4 — Negative test: prove that -mod=readonly fails on mutation.
  #
  # The working tree is never modified. A temporary copy of the module
  # is created, the copy's go.sum is emptied, and a build is attempted
  # against the copy. The build must fail because -mod=readonly refuses
  # to fetch the missing checksums.
  #
  # An empty go.sum is a valid file. A go.sum containing a comment is
  # not: the format is strictly "<module> <version> <hash>" per line,
  # and any other line is a parse error. The test therefore truncates
  # the file to zero bytes rather than writing a marker into it.
  verify:reproducible:negative:
    desc: Prove that -mod=readonly prevents go.sum mutation (WBS 2.3.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        tmpdir=$(mktemp -d)
        trap 'rm -rf "$tmpdir"' EXIT

        # Copy the module files needed to attempt a build.
        cp go.mod "$tmpdir/go.mod"
        cp go.sum "$tmpdir/go.sum"
        cp -R cmd "$tmpdir/cmd" 2>/dev/null || true
        cp -R internal "$tmpdir/internal" 2>/dev/null || true

        # Sanity check: the copy must contain at least one Go source
        # file. If it does not, the build would succeed trivially and
        # the negative test would be meaningless.
        if ! find "$tmpdir" -name '*.go' -print -quit | grep -q .; then
          echo "FAIL: negative test cannot run — no Go source files copied" >&2
          exit 1
        fi

        # Truncate go.sum to zero bytes. This is a valid but empty
        # file. Every module requirement in go.mod now lacks a
        # checksum, and Go must resolve the modules. Under
        # -mod=readonly, resolution fails because Go refuses to write
        # the missing checksums.
        #
        # Do NOT write a comment or marker into go.sum: the file
        # format does not support comments, and any non-conforming
        # line causes a parse error that masks the -mod=readonly
        # failure the test is trying to observe.
        : > "$tmpdir/go.sum"

        # Attempt the build in the temp directory. It must fail.
        cd "$tmpdir"

        if GOFLAGS=-mod=readonly go build ./... 2>"$tmpdir/build.err"; then
          echo "FAIL: build succeeded despite empty go.sum" >&2
          echo "      -mod=readonly is not being honoured." >&2
          echo "" >&2
          echo "Diagnostic output:" >&2
          cat "$tmpdir/build.err" >&2 || true
          exit 1
        fi

        # The build failed. Verify the failure is attributable to
        # -mod=readonly and not to some unrelated error such as a
        # syntax error in the tampered file.
        #
        # The Go toolchain emits one of a small number of diagnostic
        # strings in this case. The list below is deliberately broad:
        # different Go versions phrase the message differently, and
        # the test should pass on any version that honours the flag.
        if ! grep -qE 'missing go.sum entry|updates to go.sum needed|mod=readonly|module lookup disabled|verify.*missing' \
                "$tmpdir/build.err"; then
          echo "FAIL: build failed, but not because of -mod=readonly" >&2
          echo "" >&2
          echo "Diagnostic output:" >&2
          cat "$tmpdir/build.err" >&2 || true
          exit 1
        fi

        echo "OK: -mod=readonly correctly prevented silent mutation"

  # ═══════════════════════════════════════════════════════════════════════════
  # Cobra — pin and wiring verification (WBS 2.4.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify:cobra enforces the mechanical parts of the Cobra pin: the
  # version is exact, the checksum is present, the import is confined
  # to a single file, and the dependency is documented.
  #
  # The substantive parts (why Cobra was chosen, what its transitive
  # tree looks like) are enforced by review and by ADR-002.
  #
  # CI should call verify:cobra; contributors should call it before
  # committing changes to go.mod or to internal/cli/root.go.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:cobra:
    desc: Verify Cobra is pinned, wired, and documented (WBS 2.4.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:cobra:pinned
      - task: verify:cobra:checksum
      - task: verify:cobra:single-import
      - task: verify:cobra:documented

  # AC1 — go.mod pins Cobra to an exact version.
  verify:cobra:pinned:
    desc: Confirm go.mod pins Cobra to an exact version
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        line=$(grep -E 'github\.com/spf13/cobra[[:space:]]' go.mod | head -1 || true)
        if [ -z "$line" ]; then
          echo "FAIL: Cobra is not in go.mod" >&2
          exit 1
        fi
        if echo "$line" | grep -q 'latest'; then
          echo "FAIL: Cobra is pinned to 'latest' (forbidden)" >&2
          exit 1
        fi
        if echo "$line" | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
          echo "OK: Cobra is pinned: $line"
        else
          echo "FAIL: Cobra does not have an exact semver pin" >&2
          echo "  line: $line" >&2
          exit 1
        fi

  # AC2 — go.sum contains checksum entries for Cobra.
  verify:cobra:checksum:
    desc: Confirm go.sum contains checksums for Cobra
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if [ ! -f go.sum ]; then
          echo "FAIL: go.sum missing" >&2
          exit 1
        fi
        count=$(grep -c '^github.com/spf13/cobra ' go.sum || true)
        if [ "$count" -lt 1 ]; then
          echo "FAIL: go.sum has no entry for Cobra" >&2
          exit 1
        fi
        echo "OK: go.sum has $count checksum entries for Cobra"

    # AC6 — Cobra is imported in exactly one *non-test* file.
  #
  # Test files are excluded: they may reference the import path as a
  # string (for assertions) or import Cobra directly (for integration
  # tests). Neither is a violation of the "single importer" rule,
  # which concerns production code.
  verify:cobra:single-import:
    desc: Confirm Cobra is imported in exactly one non-test file
    dir: "{{.ROOT}}"
    cmds:
      - |
        set -euo pipefail
        files=$(grep -rl '"github.com/spf13/cobra"' --include='*.go' . 2>/dev/null \
          | grep -v '_test\.go$' \
          | sort || true)
        count=$(echo "$files" | grep -c . || true)
        if [ "$count" -ne 1 ]; then
          echo "FAIL: Cobra is imported in $count non-test files (expected 1)" >&2
          echo "$files" >&2
          echo "" >&2
          echo "Cobra should be imported only by internal/cli/root.go." >&2
          echo "If Cobra is imported by another production file, move" >&2
          echo "the affected logic into internal/cli. If Cobra is" >&2
          echo "imported by a test file, this is expected and the test" >&2
          echo "file should reference it via a shared constant." >&2
          exit 1
        fi
        echo "OK: Cobra is imported in exactly one non-test file: $files"

  # AC7 — Cobra is documented in docs/dependency-policy.md.
  verify:cobra:documented:
    desc: Confirm Cobra is documented in the dependency policy
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        file="{{.DEP_POLICY}}"
        if [ ! -f "$file" ]; then
          echo "FAIL: $file is missing" >&2
          exit 1
        fi
        if ! grep -q 'github.com/spf13/cobra' "$file"; then
          echo "FAIL: Cobra is not documented in $file" >&2
          exit 1
        fi
        if ! grep -q 'v1.8.1' "$file"; then
          echo "FAIL: Cobra's pinned version is not documented in $file" >&2
          exit 1
        fi
        echo "OK: Cobra is documented in $file"

  # ═══════════════════════════════════════════════════════════════════════════
  # Dependency policy — enforcement (WBS 2.5.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify:deps enforces the mechanical parts of the dependency policy
  # in docs/dependency-policy.md. The substantive parts (standard-
  # library-first justification, ADR review, license analysis) are
  # enforced by code review.
  #
  # The mechanical parts that are enforced:
  #
  #   - Every direct dependency is pinned to an exact semantic version.
  #   - The exact set of direct dependencies is known and controlled.
  #   - Every direct dependency is documented in the policy's registry.
  #   - No unused dependency appears in go.mod.
  #
  # The implementation of each check lives in scripts/deps/*.sh. The
  # Taskfile provides the interface; the scripts provide the logic.
  # This split is necessary because the checks invoke `go list -m`
  # with a Go template format string, and that template syntax
  # collides with Task's own template parser when inlined.
  #
  # When a new dependency is added, update the DEP_ALLOWED_DIRECT
  # variable in this file AND add a registry entry to the policy in
  # the same commit. The verify:deps:single task enforces that the two
  # stay in sync.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:deps:
    desc: Verify the dependency policy is respected (WBS 2.5.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:deps:env-policy
      - task: verify:deps:integrity
      - task: verify:deps:drift
      - task: verify:deps:pin
      - task: verify:deps:single
      - task: verify:deps:documented
      - task: verify:deps:no-unused
      - task: verify:deps:pr-check

  # AC1–AC5 (WBS 3.3.2) — pull request dependency policy.
  #
  # Detects the four mechanically detectable violation types
  # (V1, V2, V3, V4) defined in docs/dependency-policy.md, section
  # "Dependency change detection".
  #
  # V1 is reported as a warning (the script cannot determine whether
  # an addition is justified). V2, V3, V4 are errors.
  #
  # The implementation lives in scripts/deps/check-pr-deps.sh.
  # When invoked without a base revision, only V2, V3, V4 are
  # checked. When invoked with --base=<revision>, V1 is also
  # checked.
  verify:deps:pr-check:
    desc: Detect PR dependency violations (WBS 3.3.2)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/check-pr-deps.sh

  # AC1–AC8 (WBS 3.3.1) — dependency drift detection.
  #
  # Detects the five drift types defined in WBS 3.3.1:
  #
  #   D1  go.sum missing entries required by go.mod.
  #   D2  go.sum extra entries not referenced by go.mod.
  #   D3  go.mod not tidy.
  #   D4  go.mod inconsistent with the pinned toolchain.
  #   D5  Unpinned dependency version.
  #
  # The implementation lives in scripts/deps/detect-drift.sh.
  verify:deps:drift:
    desc: Detect go.mod / go.sum drift (WBS 3.3.1)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/detect-drift.sh
  
  # AC1–AC7 (WBS 3.2.2) — module resolution policy.
  #
  # Verifies that the running environment conforms to the module
  # resolution policy documented in docs/dependency-policy.md,
  # section "Module resolution policy".
  #
  # The implementation lives in scripts/deps/verify-env-policy.sh.
  verify:deps:env-policy:
    desc: Verify the environment conforms to the module resolution policy (WBS 3.2.2)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/verify-env-policy.sh
  
  # ═══════════════════════════════════════════════════════════════════════════
  # Reproducibility — module resolution (WBS 3.2.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify:resolution proves the module resolution reproducibility
  # invariant: given the same commit and pinned toolchain, two
  # independent clean environments resolve identical module trees.
  #
  # This is distinct from verify:reproducible, which verifies the
  # environment-level reproducibility of the current working tree.
  # The two checks have different scopes:
  #
  #   - verify:reproducible   — is *this* environment consistent?
  #   - verify:resolution     — do *any* two environments agree?
  #
  # The implementation lives in
  # scripts/reproducible/verify-resolution.sh. See that file for the
  # formal invariant and the definition of "clean environment".
  #
  # CI should call this task; contributors should run it before
  # opening a pull request. It is composed into `verify` and `check`.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:resolution:
    desc: Verify module resolution is reproducible across environments (WBS 3.2.1)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/reproducible/verify-resolution.sh
  
  # AC1–AC4 (WBS 3.1.1) — go.sum integrity against go.mod.
  #
  # Verifies that:
  #   - go.sum exists and is tracked by git.
  #   - go.mod and go.sum are clean (no uncommitted changes).
  #   - go mod tidy produces no diff.
  #   - A corrupted go.sum fails the build with a checksum error.
  #
  # The implementation lives in scripts/deps/verify-integrity.sh.
  verify:deps:integrity:
    desc: Verify go.sum integrity against go.mod (WBS 3.1.1)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/verify-integrity.sh

  # Every direct dependency must be pinned to an exact semantic
  # version. Ranges, branches, pseudo-versions, and +incompatible
  # versions are prohibited.
  #
  # The implementation lives in scripts/deps/verify-pin.sh.
  verify:deps:pin:
    desc: Confirm every direct dependency is pinned to an exact version
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-pin.sh

  # The exact set of direct dependencies is controlled. Adding a
  # dependency requires updating DEP_ALLOWED_DIRECT in Taskfile.yml
  # AND adding a registry entry to the policy document.
  #
  # The implementation lives in scripts/deps/verify-single.sh.
  verify:deps:single:
    desc: Confirm the direct dependency set matches DEP_ALLOWED_DIRECT
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-single.sh "{{.DEP_ALLOWED_DIRECT}}"

  # Every direct dependency must have an entry in the registry in
  # docs/dependency-policy.md.
  #
  # The implementation lives in scripts/deps/verify-documented.sh.
  verify:deps:documented:
    desc: Confirm every direct dependency is documented in the policy
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-documented.sh "{{.DEP_POLICY}}"

  # No unused dependency may appear in go.mod.
  #
  # The implementation lives in scripts/deps/verify-no-unused.sh.
  verify:deps:no-unused:
    desc: Confirm no direct dependency is unused
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-no-unused.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # Lint — documentation and configuration quality
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # lint:* namespaces all linting tasks. Currently only Markdown is linted.
  # Future additions (YAML lint, shellcheck, golangci-lint) will follow the
  # same naming convention: `lint:yaml`, `lint:sh`, `lint:go`.
  #
  # The `lint` composed task runs every linter. CI should call this task.
  # Contributors should call it before opening a pull request.
  #
  # Prerequisites:
  #
  #   markdownlint-cli2 — install via npm:
  #       npm install -g markdownlint-cli2
  #   or via Homebrew:
  #       brew install markdownlint-cli2
  #   or via Go:
  #       go install github.com/DavidAnson/markdownlint-cli2@latest
  #
  # The linter honours .markdownlint.yaml at the repository root.
  # ═══════════════════════════════════════════════════════════════════════════

  lint:
    desc: Run all linters (Markdown, and future linters)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: lint:md

  # ─────────────────────────────────────────────────────────────
  # Markdown linting
  # ─────────────────────────────────────────────────────────────
  #
  # Lints all Markdown files in the repository against the rules defined
  # in .markdownlint.yaml. Fails the build on any violation.
  #
  # Common fixes for frequent violations:
  #
  #   MD022 — Ensure exactly one blank line after every heading.
  #   MD032 — Ensure exactly one blank line before and after every list.
  #   MD031 — Ensure blank lines around fenced code blocks.
  #   MD040 — Add a language identifier to every fenced code block.
  #   MD044 — Use canonical capitalisation for proper names (CLI, Linux, etc.).
  #
  # To auto-fix what can be fixed automatically, run: task lint:md:fix
  lint:md:
    desc: Lint all Markdown files (WBS 2.1.x — documentation quality)
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: command -v markdownlint-cli2 >/dev/null 2>&1
        msg: |
          markdownlint-cli2 is not installed.
          Install with one of:
            npm install -g markdownlint-cli2
            brew install markdownlint-cli2
            go install github.com/DavidAnson/markdownlint-cli2@latest
      - sh: test -f {{.MD_CONFIG}}
        msg: "Markdown lint config not found: {{.MD_CONFIG}}"
    cmds:
      - markdownlint-cli2 --config {{.MD_CONFIG}} "{{.MD_GLOB}}"

  # Auto-fix Markdown violations where possible.
  #
  # This task modifies files in place. It is safe to run in a git working
  # tree because every change is reviewable via `git diff`. It should NOT
  # be part of CI; it is a contributor convenience.
  #
  # After running, review the diff and commit intentional changes.
  lint:md:fix:
    desc: Auto-fix Markdown violations where possible (modifies files)
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: command -v markdownlint-cli2 >/dev/null 2>&1
        msg: "markdownlint-cli2 is not installed (see lint:md task for install instructions)"
      - sh: test -f {{.MD_CONFIG}}
        msg: "Markdown lint config not found: {{.MD_CONFIG}}"
    cmds:
      - markdownlint-cli2 --config {{.MD_CONFIG}} --fix "{{.MD_GLOB}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Verify — composition of all verification tasks
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify is the single entry point for "is this repository healthy?".
  # It composes every verify:* task:
  #
  #   - module:*            — Go module configuration
  #   - goversion:*         — Go version matrix
  #   - verify:reproducible — Reproducibility invariant
  #   - verify:cobra        — Cobra pin and wiring
  #   - verify:deps         — Dependency policy enforcement
  #
  # CI should call this task; contributors should run it before opening
  # a pull request.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:
    desc: Run all verification tasks
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: module:verify
      - task: goversion:verify
      - task: verify:reproducible
      - task: verify:resolution
      - task: verify:cobra
      - task: verify:deps

  # ═══════════════════════════════════════════════════════════════════════════
  # Tidy — dependency lockfile maintenance (WBS 2.3.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # tidy is deliberately NOT part of `check` or `build`. It mutates
  # go.mod and go.sum and must only be run deliberately by a maintainer
  # on a clean branch. See docs/development.md for the workflow.
  #
  # This task is idempotent on a clean tree: running it twice produces
  # no additional changes.
  # ═══════════════════════════════════════════════════════════════════════════

  tidy:
    desc: Run go mod tidy (maintainers only; run on a clean branch)
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: test -z "$(git status --porcelain 2>/dev/null)"
        msg: |
          Working tree is not clean. Commit or stash changes before
          running tidy. See docs/development.md "How go mod tidy
          should be run".
    cmds:
      - go mod tidy
      - |
        set -euo pipefail
        if git diff --quiet -- go.mod go.sum 2>/dev/null; then
          echo "OK: no changes needed (go.mod and go.sum were already tidy)"
        else
          echo "UPDATED: go.mod and/or go.sum changed"
          echo "Review with: git diff go.mod go.sum"
        fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Build — binary compilation with injected metadata (WBS 17.4)
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    desc: Build the Forge binary with injected metadata
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o forge ./cmd/forge
    sources:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    generates:
      - forge

  build:debug:
    desc: Build the Forge binary with debug symbols (no trimpath)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o forge ./cmd/forge

  # ═══════════════════════════════════════════════════════════════════════════
  # Development — tests, formatting, static analysis
  # ═══════════════════════════════════════════════════════════════════════════

  test:
    desc: Run fast unit tests with the race detector
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go test -race -count=1 ./...

  # Integration tests compile the forge binary and invoke it as a
  # subprocess. They are gated behind the `integration` build tag so
  # that the default `task test` run stays fast.
  #
  # Run explicitly with: task test:integration
  # Run only the fast subset: task test:integration:short
  test:integration:
    desc: Run integration tests (compiles and invokes the binary)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go test -race -tags=integration -count=1 ./...

  test:integration:short:
    desc: Run integration tests in short mode (skips slow cases)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go test -race -short -tags=integration -count=1 ./...

  fmt:
    desc: Format all Go source files
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Verify all Go files are formatted (fails if not)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "FAIL: unformatted files:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
        echo "OK: all files formatted"

  vet:
    desc: Run go vet across all packages
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go vet ./...

  # Composed quality gate. Runs cheap checks first, expensive checks last.
  # Mirrors the shape of `adr:new`'s composition of sub-tasks so the file
  # has a consistent structural idiom.
  #
  # Order rationale:
  #
  #   1. fmt:check              — instant; formatting drift
  #   2. lint                   — fast; documentation drift
  #   3. vet                    — fast; obvious Go issues
  #   4. goversion:verify       — moderate; toolchain matrix
  #   5. verify:reproducible    — moderate; environment, tidy, and
  #                               negative test
  #   6. verify:cobra           — fast; Cobra pin and wiring
  #   7. verify:deps            — fast; dependency policy
  #   8. test                   — slow; full test suite
  #   9. test:integration       — slowest; process boundary
  check:
    desc: |
      Run the full quality gate
      (format, lint, vet, version matrix, reproducibility, cobra,
       dependency policy, test, integration)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: fmt:check
      - task: lint
      - task: vet
      - task: goversion:verify
      - task: verify:reproducible
      - task: verify:resolution
      - task: verify:cobra
      - task: verify:deps
      - task: test
      - task: test:integration

