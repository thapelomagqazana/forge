# =============================================================================
# Taskfile.yml — Forge engineering workflow
# =============================================================================
#
# This is the canonical entry point for every routine operation on the Forge
# repository. Contributors should not need to memorise raw `go`, `git`, or
# shell commands; every routine operation has a named task.
#
# Run `task --list` to see all available tasks.
#
# Structure:
#
#   adr:*                — Architecture Decision Record management
#   hooks:*              — Local Git hooks management (WBS 2.6.1)
#   module:*             — Go module verification (WBS 2.1.1)
#   goversion:*          — Go version matrix verification (WBS 2.1.2)
#   verify:*             — Composed verification namespaces
#     verify:reproducible    — Reproducibility invariant (WBS 2.3.1)
#     verify:cobra           — Cobra pin and wiring (WBS 2.4.1)
#     verify:deps            — Dependency policy enforcement (WBS 2.5.1)
#     verify:resolution      — Module resolution reproducibility (WBS 3.2.1)
#     verify:handler-boundary — Handler / service boundary (WBS 4.3.1)
#     verify:two-boundary    — Two-boundary execution model (WBS 4.2.2)
#   lint:*               — Linting (Markdown, and future linters)
#   tidy                 — Dependency lockfile maintenance (maintainers only)
#   build:*              — Binary compilation with injected metadata
#   test                 — Fast unit tests
#   test:integration     — Process-boundary integration tests
#   fmt*                 — Go formatting
#   vet                  — Static analysis
#   check                — Full quality gate
#   verify               — Composition of all verify:* tasks
#   clean                — Remove build artifacts
#   default              — List all tasks
#
# Conventions:
#
#   - Every task sets `dir: "{{.USER_WORKING_DIR}}"` so tasks work from any
#     subdirectory of the repository.
#   - Multi-step shell logic uses `set -euo pipefail` to fail fast.
#   - Verification tasks print `OK:` on success and `FAIL:` on failure so
#     CI logs are greppable.
#   - Internal helpers are marked `internal: true` and must not be invoked
#     directly by contributors.
#   - Checks that invoke commands containing Go template syntax
#     (`go list -m -f '{{...}}'`) live in scripts/ rather than inline.
#     Task parses `cmds:` blocks as Go templates, and the two template
#     syntaxes collide when inlined.
# =============================================================================

version: '3'

# =============================================================================
# Variables
# =============================================================================
#
# These variables are computed once per task invocation. Several shell
# invocations (`git describe`, `git rev-parse`, `date -u`) tolerate failure
# by falling back to a default, so that a fresh clone without tags still
# produces a valid build.
# =============================================================================

vars:

  # ───────────────────────────────────────────────────────────────────────────
  # ADR configuration
  # ───────────────────────────────────────────────────────────────────────────
  ADR_DIR: docs/decisions
  ADR_TEMPLATE: "{{.ADR_DIR}}/template.md"
  ADR_SCRIPTS: scripts/adr

  # ───────────────────────────────────────────────────────────────────────────
  # Module configuration (WBS 2.1.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # MODULE must match go.mod exactly. The `module:verify:path` task enforces
  # this at CI time. If you change the module path, change it in both places
  # in the same commit.
  #
  # VERSION_PKG is the linker injection target. As of WBS 4.3.1, the package
  # internal/version exists and defines:
  #
  #   var Value     string
  #   var Commit    string
  #   var BuildDate string
  #   var Dirty     string
  #
  # Before WBS 4.3.1, the first three variables lived in internal/cli. They
  # were relocated to internal/version to break an import cycle that WBS
  # 4.3.1 introduced: internal/cli imports internal/app/version (for the
  # `forge version` handler), and internal/app/version would need to import
  # internal/cli (for the variables). Relocating the variables to a leaf
  # package breaks the cycle.
  #
  # Any change to the VERSION_PKG path must be accompanied by a change to
  # every build script, CI configuration, and release pipeline that injects
  # these values via -X. The `verify:handler-boundary` task and the test
  # `TestBuildInfo_ReadsFromVersionPackage` in internal/app/version pin the
  # contract.
  MODULE: 'github.com/thapelomagqazana/forge'
  VERSION_PKG: '{{.MODULE}}/internal/version'

  # ───────────────────────────────────────────────────────────────────────────
  # Go version matrix (WBS 2.1.2)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # These values mirror the frozen matrix in docs/development.md and
  # ADR-004-go-version-matrix.md. They are consumed by the
  # `goversion:verify:*` tasks.
  #
  # When the matrix is intentionally changed (via an ADR that supersedes
  # ADR-004), update these three values, go.mod, and docs/development.md
  # in the same commit.
  #
  #   GO_MIN     — Minimum supported version (the contract)
  #   GO_DEV     — Current development version (the recommended toolchain)
  #   GO_LATEST  — Latest supported version (tested in CI)
  #
  # Do NOT use `latest` as a value. The policy is to pin exact versions
  # so that behaviour is reproducible across contributors and CI runs.
  GO_MIN: '1.23.0'
  GO_DEV: '1.23.4'
  GO_LATEST: '1.24'

  # ───────────────────────────────────────────────────────────────────────────
  # Reproducibility configuration (WBS 2.3.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # GOFLAGS_REQUIRED — the value that GOFLAGS must contain for reproducible
  # builds. It is checked by verify:reproducible:env.
  #
  # GOTOOLCHAIN_REQUIRED — the value that GOTOOLCHAIN must be set to. It
  # allows Go to honour the `toolchain` directive in go.mod.
  #
  # Both values are also documented in docs/development.md, so that
  # contributors can set them in their shell profiles.
  GOFLAGS_REQUIRED: '-mod=readonly'
  GOTOOLCHAIN_REQUIRED: 'auto'

  # ───────────────────────────────────────────────────────────────────────────
  # Dependency policy configuration (WBS 2.5.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # DEP_POLICY — path to the dependency policy document. Checked for
  # existence by verify:deps:documented.
  #
  # DEP_ALLOWED_DIRECT — the exact set of direct dependencies permitted in
  # Phase 2, one module path per line. Any change to this set requires
  # updating this variable AND adding a registry entry to the policy
  # document. The two changes must be made in the same commit.
  #
  #   Phase 2 permits two direct dependencies:
  #
  #     - github.com/spf13/cobra — the CLI framework. Cobra provides
  #       the command tree, the flag parser, and the help and version
  #       subsystems.
  #
  #     - github.com/spf13/pflag — POSIX/GNU-style flag parsing. pflag
  #       is a first-class part of Cobra's public API: Cobra exposes
  #       cobra.Command.Flags() as a *pflag.FlagSet, and any code that
  #       inspects or iterates a command's flags names pflag types.
  #       The Go toolchain classifies pflag as a direct dependency
  #       because of those references.
  #
  #   The list grows as future WBS items introduce dependencies. Adding
  #   a new direct dependency requires an ADR that names the consumer
  #   WBS item and justifies the addition. See docs/cli-ux-spec.md
  #   section 4.11 for the flag-inventory freeze and
  #   docs/dependency-policy.md for the full policy.
  DEP_POLICY: 'docs/dependency-policy.md'
  DEP_ALLOWED_DIRECT: |
    github.com/spf13/cobra
    github.com/spf13/pflag

  # ───────────────────────────────────────────────────────────────────────────
  # Markdown lint configuration (WBS 2.1.x — documentation quality)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # MD_GLOB — the set of Markdown files to lint.
  #
  # The glob intentionally excludes generated documentation under dist/
  # and any build output. It intentionally includes:
  #
  #   - docs/            (all specification and reference documents)
  #   - *.md at root     (README, CONTRIBUTING, SECURITY, etc.)
  #   - cmd/**/README.md (per-command documentation)
  #   - internal/**/*.md (package-level documentation)
  #   - scripts/**/*.md  (tooling documentation)
  #
  # MD_CONFIG — path to the markdownlint configuration file.
  #
  # The configuration is authoritative; see .markdownlint.yaml for the
  # rationale behind each enabled or disabled rule.
  MD_GLOB: '**/*.md'
  MD_CONFIG: '.markdownlint.yaml'

  # ───────────────────────────────────────────────────────────────────────────
  # Handler / service boundary configuration (WBS 4.3.1)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # HANDLER_FILES — the set of Cobra handler files under internal/cli that
  # are subject to the boundary rules. As new commands are added in WBS 5.x,
  # 6.x, 7.x, and 9.x, they are appended here.
  #
  # HANDLER_BODY_MAX_LINES — the maximum number of lines in the RunE
  # closure of a handler. The rule is "under 20 lines of handler body".
  #
  # The strict check on the handler body is in
  # internal/cli/version_test.go (TestNewVersionCmd_HandlerIsThin). The
  # Taskfile target is a fast pre-commit check; the test is the source of
  # truth.
  HANDLER_FILES: 'internal/cli/version.go'
  HANDLER_BODY_MAX_LINES: '20'

  # ───────────────────────────────────────────────────────────────────────────
  # Build metadata (injected at link time)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # VERSION: git describe with tags, or "dev" on a fresh clone.
  # COMMIT:  short SHA of HEAD, or "none" outside a git repository.
  # BUILD_DATE: RFC 3339 UTC, always safe to compute.
  # DIRTY:   "true" if the working tree has uncommitted changes, else "false".
  VERSION:
    sh: 'git describe --tags --always --dirty 2>/dev/null || echo dev'
  COMMIT:
    sh: 'git rev-parse --short HEAD 2>/dev/null || echo none'
  BUILD_DATE:
    sh: 'date -u +%Y-%m-%dT%H:%M:%SZ'
  DIRTY:
    sh: 'test -n "$(git status --porcelain 2>/dev/null)" && echo true || echo false'

  # Linker flags passed to `go build -ldflags "..."`.
  #
  # The variable names (Value, Commit, BuildDate, Dirty) must match the
  # declarations in internal/version/version.go exactly. WBS 4.3.1 renamed
  # the first field from Version to Value to avoid stuttering at the call
  # site (version.Value reads as "the version package's Value"), but the
  # ldflags path is unchanged. A future change to any of these names must
  # update both this block and the variable declarations in the same
  # commit; verify:handler-boundary checks the pairing.
  LDFLAGS: >-
    -X {{.VERSION_PKG}}.Value={{.VERSION}}
    -X {{.VERSION_PKG}}.Commit={{.COMMIT}}
    -X {{.VERSION_PKG}}.BuildDate={{.BUILD_DATE}}
    -X {{.VERSION_PKG}}.Dirty={{.DIRTY}}

# =============================================================================
# Tasks
# =============================================================================

tasks:

  # ───────────────────────────────────────────────────────────────────────────
  # Default
  # ───────────────────────────────────────────────────────────────────────────
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ═══════════════════════════════════════════════════════════════════════════
  # ADR — Architecture Decision Record management
  # ═══════════════════════════════════════════════════════════════════════════

  adr:new:
    desc: "Create a new ADR: task adr:new -- 'Decision title'"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: test -d {{.ADR_DIR}}
        msg: "ADR directory does not exist: {{.ADR_DIR}}"
      - sh: test -f {{.ADR_TEMPLATE}}
        msg: "ADR template does not exist: {{.ADR_TEMPLATE}}"
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Usage: task adr:new -- 'Decision title'"
    cmds:
      - task: adr:_create
        vars:
          TITLE: '{{.CLI_ARGS}}'
      - task: adr:index

  adr:_create:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/new.sh {{.ADR_DIR}} "{{.TITLE}}"

  adr:supersede:
    desc: "Supersede an old ADR: task adr:supersede -- 'old-number' 'new-title'"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: test -n "{{index .CLI_ARGS 0}}"
        msg: "Usage: task adr:supersede -- 'old-number' 'new-title'"
      - sh: test -n "{{index .CLI_ARGS 1}}"
        msg: "Usage: task adr:supersede -- 'old-number' 'new-title'"
    cmds:
      - task: adr:_supersede
        vars:
          OLD_NUM: '{{index .CLI_ARGS 0}}'
          NEW_TITLE: '{{index .CLI_ARGS 1}}'
      - task: adr:index

  adr:_supersede:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/supersede.sh {{.ADR_DIR}} "{{.OLD_NUM}}" "{{.NEW_TITLE}}"

  adr:index:
    desc: Regenerate the ADR index
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/index.sh {{.ADR_DIR}}

  adr:list:
    desc: "List ADRs: task adr:list [-- --status=Proposed]"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/list.sh {{.ADR_DIR}} {{.CLI_ARGS}}

  adr:lint:
    desc: Check all ADRs for format completeness
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - bash {{.ADR_SCRIPTS}}/lint.sh {{.ADR_DIR}}

  # ═══════════════════════════════════════════════════════════════════════════
  # Hooks — local Git hooks management (WBS 2.6.1)
  # ═══════════════════════════════════════════════════════════════════════════

  hooks:install:
    desc: Install the Forge Git hooks into the local clone (run once)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/install-hooks.sh

  hooks:uninstall:
    desc: Remove the Forge Git hooks from the local clone
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - git config --unset core.hooksPath || true
      - echo "OK - hooks uninstalled"

  hooks:status:
    desc: Report whether the Forge Git hooks are installed
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        current=$(git config --get core.hooksPath 2>/dev/null || echo "")
        if [ "$current" = ".githooks" ]; then
          echo "OK: hooks installed (core.hooksPath = .githooks)"
        else
          echo "WARN: hooks not installed (core.hooksPath = ${current:-unset})"
          echo "      Run 'task hooks:install' to install them."
        fi

  hooks:test:
    desc: Run the pre-commit checks without creating a commit
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh .githooks/pre-commit

  hooks:test:push:
    desc: Run the pre-push checks without pushing
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh .githooks/pre-push

  # ═══════════════════════════════════════════════════════════════════════════
  # Module — verification of go.mod configuration (WBS 2.1.1)
  # ═══════════════════════════════════════════════════════════════════════════

  module:verify:
    desc: Verify the Go module is correctly configured (WBS 2.1.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: module:verify:exists
      - task: module:verify:path
      - task: module:verify:lowercase
      - task: module:verify:matches-url
      - task: module:verify:builds
      - task: module:verify:tidy

  module:verify:exists:
    desc: Confirm go.mod exists at repository root
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if [ ! -f go.mod ]; then
          echo "FAIL: go.mod missing at repository root" >&2
          exit 1
        fi
        echo "OK: go.mod exists"

  module:verify:path:
    desc: Confirm the module directive matches the canonical path
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        actual=$(grep -E '^module ' go.mod | awk '{print $2}')
        if [ "$actual" != "{{.MODULE}}" ]; then
          echo "FAIL: module path mismatch" >&2
          echo "  expected: {{.MODULE}}" >&2
          echo "  actual:   $actual" >&2
          exit 1
        fi
        echo "OK: module path = $actual"

  module:verify:lowercase:
    desc: Confirm the module path contains no uppercase letters
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        path=$(grep -E '^module ' go.mod | awk '{print $2}')
        if echo "$path" | grep -qE '[A-Z]'; then
          echo "FAIL: module path contains uppercase letters: $path" >&2
          exit 1
        fi
        echo "OK: module path is lowercase"

  module:verify:matches-url:
    desc: Confirm the module path matches the GitHub repository URL (warning only)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        mod=$(grep -E '^module ' go.mod | awk '{print $2}')
        remote=$(git config --get remote.origin.url 2>/dev/null || echo "")
        remote_normalised=$(echo "$remote" \
          | sed -E 's#^git@([^:]+):#\1/#' \
          | sed -E 's#^https?://##' \
          | sed -E 's#\.git$##')
        if [ -n "$remote_normalised" ] && [ "$remote_normalised" != "$mod" ]; then
          echo "WARN: module path ($mod) differs from git remote ($remote_normalised)" >&2
          echo "      Acceptable if the remote URL is not yet canonical." >&2
        else
          echo "OK: module path matches git remote"
        fi

  module:verify:builds:
    desc: Confirm go build ./... succeeds (no-op when no packages exist)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go build ./...
      - echo "OK - go build succeeded"

  module:verify:tidy:
    desc: Confirm go mod tidy produces no diff on a clean checkout
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        go mod tidy
        if ! git diff --quiet -- go.mod go.sum 2>/dev/null; then
          echo "FAIL: go mod tidy produced changes" >&2
          git diff -- go.mod go.sum
          exit 1
        fi
        echo "OK: go.mod is tidy"

  # ═══════════════════════════════════════════════════════════════════════════
  # Go version matrix — verification (WBS 2.1.2)
  # ═══════════════════════════════════════════════════════════════════════════

  goversion:verify:
    desc: Verify the Go version matrix is documented and enforced (WBS 2.1.2)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: goversion:verify:go-directive
      - task: goversion:verify:toolchain-directive
      - task: goversion:verify:no-latest
      - task: goversion:verify:matrix-documented
      - task: goversion:verify:minimum-builds

  goversion:verify:go-directive:
    desc: Confirm go.mod contains an explicit go directive
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if ! grep -qE '^go [0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod; then
          echo "FAIL: go.mod has no valid 'go' directive" >&2
          exit 1
        fi
        actual=$(grep -E '^go ' go.mod | awk '{print $2}')
        if [ "$actual" != "{{.GO_MIN}}" ]; then
          echo "FAIL: go directive does not match frozen minimum" >&2
          echo "  expected: {{.GO_MIN}}" >&2
          echo "  actual:   $actual" >&2
          exit 1
        fi
        echo "OK: go directive = $actual"

  goversion:verify:toolchain-directive:
    desc: Confirm go.mod contains an explicit toolchain directive
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if ! grep -qE '^toolchain go[0-9]+\.[0-9]+(\.[0-9]+)?$' go.mod; then
          echo "FAIL: go.mod has no valid 'toolchain' directive" >&2
          exit 1
        fi
        actual=$(grep -E '^toolchain ' go.mod | awk '{print $2}')
        expected="go{{.GO_DEV}}"
        if [ "$actual" != "$expected" ]; then
          echo "FAIL: toolchain directive does not match frozen development version" >&2
          echo "  expected: $expected" >&2
          echo "  actual:   $actual" >&2
          exit 1
        fi
        echo "OK: toolchain directive = $actual"

  goversion:verify:no-latest:
    desc: Confirm go.mod does not use 'latest' anywhere
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if grep -qE 'latest' go.mod; then
          echo "FAIL: go.mod contains 'latest' (forbidden)" >&2
          grep -n 'latest' go.mod >&2
          exit 1
        fi
        echo "OK: no 'latest' in go.mod"

  goversion:verify:matrix-documented:
    desc: Confirm docs/development.md documents the three-tier version matrix
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        file="docs/development.md"
        if [ ! -f "$file" ]; then
          echo "FAIL: $file is missing" >&2
          exit 1
        fi
        for phrase in "Minimum supported" "Current development" "Latest supported"; do
          if ! grep -q "$phrase" "$file"; then
            echo "FAIL: $file does not document '$phrase'" >&2
            exit 1
          fi
        done
        echo "OK: version matrix documented in $file"

  goversion:verify:minimum-builds:
    desc: Confirm the minimum supported Go version builds the module
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        echo "Building with GOTOOLCHAIN=go{{.GO_MIN}} ..."
        GOTOOLCHAIN=go{{.GO_MIN}} go build ./...
        echo "OK: builds with Go {{.GO_MIN}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Reproducibility — verification of the module and toolchain contract
  # (WBS 2.3.1)
  # ═══════════════════════════════════════════════════════════════════════════

  verify:reproducible:
    desc: Verify the reproducibility invariant holds locally (WBS 2.3.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:reproducible:env
      - task: verify:reproducible:tidy
      - task: verify:reproducible:lockstep
      - task: verify:reproducible:negative

  verify:reproducible:env:
    desc: Confirm GOFLAGS and GOTOOLCHAIN are set as required
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        flags=$(go env GOFLAGS)
        toolchain=$(go env GOTOOLCHAIN)

        if ! echo "$flags" | grep -q -- "{{.GOFLAGS_REQUIRED}}"; then
          echo "FAIL: GOFLAGS does not include {{.GOFLAGS_REQUIRED}}" >&2
          echo "  actual GOFLAGS: $flags" >&2
          echo "  See docs/development.md for setup instructions." >&2
          exit 1
        fi

        if [ "$toolchain" != "{{.GOTOOLCHAIN_REQUIRED}}" ] && \
           [ "$toolchain" != "local" ]; then
          echo "FAIL: GOTOOLCHAIN is not '{{.GOTOOLCHAIN_REQUIRED}}' or 'local'" >&2
          echo "  actual GOTOOLCHAIN: $toolchain" >&2
          exit 1
        fi

        echo "OK: GOFLAGS=$flags GOTOOLCHAIN=$toolchain"

  verify:reproducible:tidy:
    desc: Confirm go mod tidy produces no diff on a clean checkout
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        backup_dir=$(mktemp -d)
        trap 'cp "$backup_dir/go.mod.bak" go.mod 2>/dev/null || true; \
              [ -f "$backup_dir/go.sum.bak" ] && cp "$backup_dir/go.sum.bak" go.sum 2>/dev/null || true; \
              rm -rf "$backup_dir"' EXIT

        cp go.mod "$backup_dir/go.mod.bak"
        [ -f go.sum ] && cp go.sum "$backup_dir/go.sum.bak"

        go mod tidy

        if ! diff -q "$backup_dir/go.mod.bak" go.mod >/dev/null 2>&1; then
          echo "FAIL: go mod tidy modified go.mod" >&2
          echo "  Run 'task tidy' on a clean branch to update." >&2
          diff "$backup_dir/go.mod.bak" go.mod >&2 || true
          exit 1
        fi

        if [ -f "$backup_dir/go.sum.bak" ] && \
           ! diff -q "$backup_dir/go.sum.bak" go.sum >/dev/null 2>&1; then
          echo "FAIL: go mod tidy modified go.sum" >&2
          exit 1
        fi

        echo "OK: go.mod and go.sum are tidy"

  verify:reproducible:lockstep:
    desc: Confirm module resolution is deterministic across runs
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        run1=$(go list -m all 2>/dev/null | sort)
        run2=$(go list -m all 2>/dev/null | sort)
        if [ "$run1" != "$run2" ]; then
          echo "FAIL: go list -m all produced different output across runs" >&2
          diff <(echo "$run1") <(echo "$run2") >&2 || true
          exit 1
        fi
        echo "OK: module resolution is deterministic"

  verify:reproducible:negative:
    desc: Prove that -mod=readonly prevents go.sum mutation (WBS 2.3.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        tmpdir=$(mktemp -d)
        trap 'rm -rf "$tmpdir"' EXIT

        cp go.mod "$tmpdir/go.mod"
        cp go.sum "$tmpdir/go.sum"
        cp -R cmd "$tmpdir/cmd" 2>/dev/null || true
        cp -R internal "$tmpdir/internal" 2>/dev/null || true

        if ! find "$tmpdir" -name '*.go' -print -quit | grep -q .; then
          echo "FAIL: negative test cannot run — no Go source files copied" >&2
          exit 1
        fi

        : > "$tmpdir/go.sum"

        cd "$tmpdir"

        if GOFLAGS=-mod=readonly go build ./... 2>"$tmpdir/build.err"; then
          echo "FAIL: build succeeded despite empty go.sum" >&2
          echo "      -mod=readonly is not being honoured." >&2
          echo "" >&2
          echo "Diagnostic output:" >&2
          cat "$tmpdir/build.err" >&2 || true
          exit 1
        fi

        if ! grep -qE 'missing go.sum entry|updates to go.sum needed|mod=readonly|module lookup disabled|verify.*missing' \
                "$tmpdir/build.err"; then
          echo "FAIL: build failed, but not because of -mod=readonly" >&2
          echo "" >&2
          echo "Diagnostic output:" >&2
          cat "$tmpdir/build.err" >&2 || true
          exit 1
        fi

        echo "OK: -mod=readonly correctly prevented silent mutation"

  # ═══════════════════════════════════════════════════════════════════════════
  # Cobra — pin and wiring verification (WBS 2.4.1)
  # ═══════════════════════════════════════════════════════════════════════════

  verify:cobra:
    desc: Verify Cobra is pinned, wired, and documented (WBS 2.4.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:cobra:pinned
      - task: verify:cobra:checksum
      - task: verify:cobra:single-import
      - task: verify:cobra:documented

  verify:cobra:pinned:
    desc: Confirm go.mod pins Cobra to an exact version
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        line=$(grep -E 'github\.com/spf13/cobra[[:space:]]' go.mod | head -1 || true)
        if [ -z "$line" ]; then
          echo "FAIL: Cobra is not in go.mod" >&2
          exit 1
        fi
        if echo "$line" | grep -q 'latest'; then
          echo "FAIL: Cobra is pinned to 'latest' (forbidden)" >&2
          exit 1
        fi
        if echo "$line" | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
          echo "OK: Cobra is pinned: $line"
        else
          echo "FAIL: Cobra does not have an exact semver pin" >&2
          echo "  line: $line" >&2
          exit 1
        fi

  verify:cobra:checksum:
    desc: Confirm go.sum contains checksums for Cobra
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if [ ! -f go.sum ]; then
          echo "FAIL: go.sum missing" >&2
          exit 1
        fi
        count=$(grep -c '^github.com/spf13/cobra ' go.sum || true)
        if [ "$count" -lt 1 ]; then
          echo "FAIL: go.sum has no entry for Cobra" >&2
          exit 1
        fi
        echo "OK: go.sum has $count checksum entries for Cobra"

  # AC6 — Cobra is imported only under internal/cli.
  #
  # # Why the rule is about packages, not files
  #
  # Before WBS 4.3.1, the rule was "exactly one file imports Cobra".
  # That was correct when internal/cli/root.go was the only file that
  # constructed commands. WBS 4.3.1 introduces the handler / service
  # pattern: each command's handler lives in its own file, and each  # handler constructs a *cobra.Command. The number of Cobra importers
  # under internal/cli is expected to grow with the number of commands.
  #
  # The rule that matters is the package boundary: Cobra is a
  # CLI-layer concern. It must not leak into internal/app (the
  # application layer), internal/domain (the domain layer), or
  # internal/infra (the infrastructure layer). A file under
  # internal/cli may import Cobra; a file outside internal/cli may
  # not.
  #
  # # What the check does
  #
  # It walks the module, skips test files and vendored/build
  # directories, and fails if any non-test file outside internal/cli
  # imports Cobra. Files under internal/cli are allowed to import it.
  #
  # # Relationship to the Go structural test
  #
  # internal/cli/structure_test.go defines
  # TestCobraImportedOnlyInCliPackage, which enforces the same rule
  # from the test side. The two checks are complementary: this one
  # runs during `task check`, the Go test runs during `go test`. They
  # must stay in sync. If you change one, change the other in the
  # same commit.
  verify:cobra:single-import:
    desc: Confirm Cobra is imported only under internal/cli (WBS 2.4.1; scope restated by WBS 4.3.1)
    dir: "{{.ROOT}}"
    cmds:
      - |
        set -euo pipefail

        # Find every non-test Go file in the module that imports
        # Cobra. Exclude common build/vendor directories.
        files=$(grep -rl '"github.com/spf13/cobra"' --include='*.go' . 2>/dev/null \
          | grep -v '_test\.go$' \
          | grep -v '^\./vendor/' \
          | grep -v '^\./node_modules/' \
          | grep -v '^\./\.git/' \
          | sort || true)

        # Split the file list into "under internal/cli" (allowed)
        # and "outside internal/cli" (offenders).
        offenders=""
        allowed=""
        for f in $files; do
          # Normalise the path: strip the leading "./" if present.
          rel="${f#./}"
          case "$rel" in
            internal/cli/*) allowed="$allowed $rel" ;;
            *) offenders="$offenders $rel" ;;
          esac
        done

        if [ -n "$offenders" ]; then
          echo "FAIL: Cobra is imported outside internal/cli:$offenders" >&2
          echo "" >&2
          echo "Cobra is a CLI-layer concern. It must not be imported by" >&2
          echo "internal/app, internal/domain, internal/infra, or any other" >&2
          echo "package outside internal/cli." >&2
          echo "" >&2
          echo "If the affected logic genuinely belongs outside internal/cli," >&2
          echo "move it into internal/cli, or add an ADR explaining why the" >&2
          echo "dependency must be imported elsewhere." >&2
          exit 1
        fi

        # Diagnostics: list the allowed importers so a reviewer can
        # see at a glance which files under internal/cli import Cobra.
        echo "OK: Cobra is imported only under internal/cli:$allowed"

  verify:cobra:documented:
    desc: Confirm Cobra is documented in the dependency policy
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        file="{{.DEP_POLICY}}"
        if [ ! -f "$file" ]; then
          echo "FAIL: $file is missing" >&2
          exit 1
        fi
        if ! grep -q 'github.com/spf13/cobra' "$file"; then
          echo "FAIL: Cobra is not documented in $file" >&2
          exit 1
        fi
        if ! grep -q 'v1.8.1' "$file"; then
          echo "FAIL: Cobra's pinned version is not documented in $file" >&2
          exit 1
        fi
        echo "OK: Cobra is documented in $file"

  # ═══════════════════════════════════════════════════════════════════════════
  # Handler / Service boundary — enforcement (WBS 4.3.1)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify:handler-boundary enforces the mechanical parts of the
  # handler / service boundary defined in docs/architecture.md section
  # 11.12 and enforced by the reviewer checklist in docs/development.md.
  #
  # The rule: a Cobra handler (RunE closure) parses flags, constructs
  # an application service, calls it, and returns an error. It does
  # not read files, does not access the network, does not contain
  # business logic, does not format output inline, and does not call
  # os.Exit or write to a process-global stream.
  #
  # The Taskfile target checks:
  #
  #   AC3  — the handler body is under HANDLER_BODY_MAX_LINES lines.
  #   AC4  — the handler file contains no direct fmt.Fprintln,
  #          fmt.Fprintf, fmt.Println, or fmt.Printf calls.
  #   AC5  — the handler file contains no os.Exit call.
  #
  # The strict checks are in internal/cli/version_test.go
  # (TestNewVersionCmd_HandlerIsThin and
  # TestNewVersionCmd_DoesNotContainBusinessLogic). Those tests
  # inspect the handler body directly; the Taskfile target is a fast
  # pre-commit check.
  #
  # When a new command is added, HANDLER_FILES is extended with the
  # new file. The extension is a review checkpoint: a reviewer sees
  # that a new handler was added and can check that it follows the
  # pattern.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:handler-boundary:
    desc: Verify the handler / service boundary is respected (WBS 4.3.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:handler-boundary:line-count
      - task: verify:handler-boundary:no-direct-io
      - task: verify:handler-boundary:no-os-exit
      - task: verify:handler-boundary:no-infra-imports
      - task: verify:handler-boundary:version-pkg-exists

  verify:handler-boundary:line-count:
    desc: Confirm each handler's RunE body is under the line limit
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        # For each handler file, extract the RunE closure and count
        # its lines. The extraction is:
        #
        #   1. Find the line that contains "RunE:".
        #   2. The handler body starts at that line.
        #   3. The handler body ends at the first subsequent line
        #      whose trimmed content is "}," or "}" and whose
        #      indentation is the same as the RunE line's.
        #
        # This matches the canonical formatting produced by gofmt.
        # If a future handler is formatted differently, replace this
        # awk script with a go/ast-based extractor.
        #
        # Counting the body rather than the whole file makes the check
        # robust against docstring growth. The docstring is where the
        # pattern is explained; it should be allowed to grow without
        # tripping the line-count check.
        failed=0
        for f in {{.HANDLER_FILES}}; do
          if [ ! -f "$f" ]; then
            echo "FAIL: handler file missing: $f" >&2
            failed=1
            continue
          fi

          body_lines=$(awk '
            # Find the RunE line.
            /RunE:/ {
              in_body = 1
              body = 0
              next
            }
            # Count lines until the matching closing brace.
            in_body {
              body++
              # The closing brace of the RunE closure is a line
              # whose trimmed content is "}," — the comma is present
              # because RunE is a struct field.
              trimmed = $0
              sub(/^[ \t]+/, "", trimmed)
              if (trimmed == "}," || trimmed == "}") {
                # Do not count the closing line.
                body--
                in_body = 0
              }
            }
            END {
              print body
            }
          ' "$f")

          if [ -z "$body_lines" ] || [ "$body_lines" -eq 0 ]; then
            echo "FAIL: could not locate RunE closure in $f" >&2
            failed=1
            continue
          fi

          if [ "$body_lines" -gt {{.HANDLER_BODY_MAX_LINES}} ]; then
            echo "FAIL: $f: RunE body is $body_lines lines; " \
                 "limit is {{.HANDLER_BODY_MAX_LINES}}" >&2
            echo "      If the handler grew, business logic likely" >&2
            echo "      leaked into it. Move the logic to" >&2
            echo "      internal/app/<name>/. See docs/architecture.md section 11.12." >&2
            failed=1
            continue
          fi
          echo "OK: $f: RunE body is $body_lines lines"
        done

        exit $failed

  verify:handler-boundary:no-direct-io:
    desc: Confirm handlers do not write to process streams directly
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if grep -nE 'fmt\.(Fprintln|Fprintf|Println|Printf)\(' \
             {{.HANDLER_FILES}}; then
          echo "FAIL: handler writes output directly" >&2
          echo "      Handlers must delegate formatting to the service" >&2
          echo "      package. See docs/architecture.md section 11.12." >&2
          exit 1
        fi
        echo "OK: handlers do not write output directly"

  verify:handler-boundary:no-os-exit:
    desc: Confirm handlers never call os.Exit
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        # Search only the RunE closure's body, not the whole file.
        # The handler's docstring explains what the handler does not
        # do; the docstring mentions os.Exit by name. A scan of the
        # whole file would match the docstring and produce a false
        # positive. The closure is the only region where an actual
        # call to os.Exit could appear.
        #
        # The extraction matches the one in
        # verify:handler-boundary:line-count. It relies on gofmt's
        # canonical formatting: RunE: on its own line, and a closing
        # brace "}," at the same indentation. If a future handler is
        # formatted differently, both extractions should be upgraded
        # together.
        failed=0
        for f in {{.HANDLER_FILES}}; do
          if [ ! -f "$f" ]; then
            echo "FAIL: handler file missing: $f" >&2
            failed=1
            continue
          fi

          body=$(awk '
            /RunE:/ { in_body = 1; next }
            in_body {
              trimmed = $0
              sub(/^[ \t]+/, "", trimmed)
              if (trimmed == "}," || trimmed == "}") { in_body = 0; next }
              print
            }
          ' "$f")

          if [ -z "$body" ]; then
            echo "FAIL: could not locate RunE closure in $f" >&2
            failed=1
            continue
          fi

          if echo "$body" | grep -n 'os\.Exit'; then
            echo "FAIL: $f calls os.Exit" >&2
            echo "      Handlers return an error; executeWithOptions maps it" >&2
            echo "      to an exit code. See docs/architecture.md section 11.7." >&2
            failed=1
            continue
          fi

          echo "OK: $f does not call os.Exit"
        done

        exit $failed

  verify:handler-boundary:no-infra-imports:
    desc: Confirm handlers do not perform filesystem I/O
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        # Handlers must go through an application service, not through
        # a lower layer. Importing internal/filesystem or
        # internal/config directly would let a handler read files or
        # parse configuration, which is business logic.
        #
        # Note: importing internal/filesystem is permitted for handlers
        # that need the FS *type* (for example, to pass it to a service
        # constructor). The check below is intentionally narrow: it
        # forbids direct calls to os.ReadFile / os.WriteFile, which is
        # what "importing internal/filesystem" would enable in practice.
        if grep -nE 'os\.(ReadFile|WriteFile|Open|Create|Remove|MkdirAll)\(' \
             {{.HANDLER_FILES}}; then
          echo "FAIL: handler performs filesystem I/O directly" >&2
          echo "      Handlers must delegate filesystem access to the" >&2
          echo "      application service. See docs/architecture.md section 11.12." >&2
          exit 1
        fi
        echo "OK: handlers do not perform filesystem I/O directly"

  verify:handler-boundary:version-pkg-exists:
    desc: Confirm internal/version declares the build metadata variables
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        # The version package is the leaf that breaks the import cycle
        # introduced by WBS 4.3.1. It must exist, it must declare the
        # four variables the LDFLAGS block injects via -X, and it must
        # not import anything from Forge (it is a leaf).
        #
        # The check must recognise both Go declaration forms:
        #
        #     var Version string
        #
        # and
        #
        #     var (
        #         Version   string
        #         Commit    string
        #         BuildDate string
        #         Dirty     string
        #     )
        #
        # The grep pattern below matches a line that begins with
        # optional whitespace followed by the variable name, and where
        # the name is followed by whitespace or the end of the line.
        # In the single form, the line is "var Version string". The
        # pattern does not match the "var " prefix, but the variable
        # name appears in the line either way, and the name is what
        # the check cares about. A more precise pattern would require
        # parsing the var block; a simple name search is sufficient
        # because the variable names are unique within the package.
        pkg_dir="internal/version"
        if [ ! -d "$pkg_dir" ]; then
          echo "FAIL: $pkg_dir does not exist" >&2
          echo "      WBS 4.3.1 requires the version variables to live in" >&2
          echo "      a leaf package to break the CLI / app/version cycle." >&2
          exit 1
        fi

        # The canonical names, matching the LDFLAGS block in this file.
        # If you rename a variable here, rename it in LDFLAGS and in
        # internal/version/version.go in the same commit.
        failed=0
        for var in Version Commit BuildDate Dirty; do
          # Match either declaration form:
          #   - "var Version string"
          #   - "    Version   string"   (inside a var block)
          #
          # The pattern requires the name to start a word and to be
          # followed by whitespace or end-of-line, to avoid matching
          # a name that is a prefix of a longer identifier (for
          # example, matching "Commit" in "CommitDate").
          if ! grep -qE "^[[:space:]]*(var[[:space:]]+)?${var}([[:space:]]|$)" \
                  "$pkg_dir"/*.go 2>/dev/null; then
            echo "FAIL: $pkg_dir does not declare var $var" >&2
            echo "      The LDFLAGS block in Taskfile.yml injects it via -X." >&2
            echo "      Declare it as either:" >&2
            echo "        var $var string" >&2
            echo "      or as a member of a var block." >&2
            failed=1
            continue
          fi
          echo "OK: $pkg_dir declares var $var"
        done

        exit $failed

  # ═══════════════════════════════════════════════════════════════════════════
  # Two-boundary execution model — enforcement (WBS 4.2.2)
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # verify:two-boundary enforces the mechanical parts of the two-boundary
  # execution model introduced by WBS 4.2.2 and documented in
  # docs/architecture.md section 11. It is the task the WBS 4.2.2
  # acceptance criteria named as verify:deps and verify:two-boundary.
  # The two are merged here into a single target to keep the Taskfile
  # legible.
  #
  # The rule: executeWithOptions is the single transformation point
  # between the process boundary (options) and the command boundary
  # (Dependencies). buildDependencies is the only function that
  # constructs a Dependencies value. defaultOptions is the only
  # function that reads os.Args, os.Stdin, os.Stdout, os.Stderr,
  # os.Getenv, or os.Getwd.
  #
  # The checks:
  #
  #   AC1  — Dependencies is defined in exactly one file.
  #   AC3  — no command constructor reads os.*.
  #   AC4  — buildDependencies is called exactly once in production.
  #   AC6  — newRootCmd accepts Dependencies, not options.
  # ═══════════════════════════════════════════════════════════════════════════

  verify:two-boundary:
    desc: Verify the two-boundary execution model (WBS 4.2.2)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:two-boundary:deps-single-definition
      - task: verify:two-boundary:no-os-in-handlers
      - task: verify:two-boundary:single-construction
      - task: verify:two-boundary:root-accepts-deps

  verify:two-boundary:deps-single-definition:
    desc: Confirm Dependencies is defined in exactly one file (AC1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        count=$(grep -rl 'type Dependencies struct' internal/cli/ \
                  --include='*.go' 2>/dev/null | wc -l)
        if [ "$count" -ne 1 ]; then
          echo "FAIL: Dependencies is defined in $count files; want 1" >&2
          grep -rn 'type Dependencies struct' internal/cli/ --include='*.go' >&2
          exit 1
        fi
        echo "OK: Dependencies is defined in exactly one file"

  verify:two-boundary:no-os-in-handlers:
    desc: Confirm command constructors do not read os.* (AC3)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if grep -nE 'os\.(Getenv|Stdout|Stderr|Args)' \
             internal/cli/commands*.go 2>/dev/null; then
          echo "FAIL: command constructor reads os.*" >&2
          exit 1
        fi
        echo "OK: no command constructor reads os.*"

  verify:two-boundary:single-construction:
    desc: Confirm buildDependencies is called exactly once (AC4)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail

        # Find every non-test .go file under internal/cli that
        # references buildDependencies(.
        #
        # Exclude the function's own declaration. Go's canonical
        # formatting places the declaration as
        #
        #     func buildDependencies(opts options) Dependencies {
        #
        # with the "func " keyword at the start of the line (after
        # optional leading tabs). A call site never begins with
        # "func ". Filtering out lines whose first non-whitespace
        # token is "func" therefore removes exactly the declaration
        # and leaves exactly the calls.
        matches=$(grep -rn 'buildDependencies(' internal/cli/ \
                    --include='*.go' 2>/dev/null \
                  | grep -v '_test.go' \
                  | grep -vE ':[[:space:]]*func[[:space:]]+buildDependencies\(' \
                  || true)

        count=$(echo "$matches" | grep -c . || true)

        if [ "$count" -ne 1 ]; then
          echo "FAIL: buildDependencies is called $count times in production code; want 1" >&2
          echo "" >&2
          echo "Call sites:" >&2
          if [ -n "$matches" ]; then
            echo "$matches" >&2
          else
            echo "  (none)" >&2
          fi
          echo "" >&2
          echo "buildDependencies must be called exactly once, from" >&2
          echo "executeWithOptions in internal/cli/execute.go. Constructing" >&2
          echo "a Dependencies value anywhere else violates AC4 of WBS 4.2.2." >&2
          echo "See docs/architecture.md section 11.5." >&2
          exit 1
        fi

        echo "OK: buildDependencies is called exactly once in production code"
        echo "    $matches"

  verify:two-boundary:root-accepts-deps:
    desc: Confirm newRootCmd accepts Dependencies, not options (AC6)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        if ! grep -q 'func newRootCmd(deps Dependencies)' internal/cli/root.go; then
          echo "FAIL: newRootCmd does not accept Dependencies" >&2
          exit 1
        fi
        if grep -q 'func newRootCmd(opts options)' internal/cli/root.go; then
          echo "FAIL: newRootCmd still accepts options" >&2
          exit 1
        fi
        echo "OK: newRootCmd accepts Dependencies"

  # ═══════════════════════════════════════════════════════════════════════════
  # Dependency policy — enforcement (WBS 2.5.1)
  # ═══════════════════════════════════════════════════════════════════════════

  verify:deps:
    desc: Verify the dependency policy is respected (WBS 2.5.1)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: verify:deps:env-policy
      - task: verify:deps:integrity
      - task: verify:deps:drift
      - task: verify:deps:pin
      - task: verify:deps:single
      - task: verify:deps:documented
      - task: verify:deps:no-unused
      - task: verify:deps:pr-check

  verify:deps:pr-check:
    desc: Detect PR dependency violations (WBS 3.3.2)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/check-pr-deps.sh

  verify:deps:drift:
    desc: Detect go.mod / go.sum drift (WBS 3.3.1)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/detect-drift.sh

  verify:deps:env-policy:
    desc: Verify the environment conforms to the module resolution policy (WBS 3.2.2)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/verify-env-policy.sh

  verify:resolution:
    desc: Verify module resolution is reproducible across environments (WBS 3.2.1)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/reproducible/verify-resolution.sh

  verify:deps:integrity:
    desc: Verify go.sum integrity against go.mod (WBS 3.1.1)
    dir: "{{.ROOT}}"
    cmds:
      - sh scripts/deps/verify-integrity.sh

  verify:deps:pin:
    desc: Confirm every direct dependency is pinned to an exact version
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-pin.sh

  verify:deps:single:
    desc: Confirm the direct dependency set matches DEP_ALLOWED_DIRECT
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-single.sh "{{.DEP_ALLOWED_DIRECT}}"

  verify:deps:documented:
    desc: Confirm every direct dependency is documented in the policy
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-documented.sh "{{.DEP_POLICY}}"

  verify:deps:no-unused:
    desc: Confirm no direct dependency is unused
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - sh scripts/deps/verify-no-unused.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # Lint — documentation and configuration quality
  # ═══════════════════════════════════════════════════════════════════════════

  lint:
    desc: Run all linters (Markdown, and future linters)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: lint:md

  lint:md:
    desc: Lint all Markdown files (WBS 2.1.x — documentation quality)
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: command -v markdownlint-cli2 >/dev/null 2>&1
        msg: |
          markdownlint-cli2 is not installed.
          Install with one of:
            npm install -g markdownlint-cli2
            brew install markdownlint-cli2
            go install github.com/DavidAnson/markdownlint-cli2@latest
      - sh: test -f {{.MD_CONFIG}}
        msg: "Markdown lint config not found: {{.MD_CONFIG}}"
    cmds:
      - markdownlint-cli2 --config {{.MD_CONFIG}} "{{.MD_GLOB}}"

  lint:md:fix:
    desc: Auto-fix Markdown violations where possible (modifies files)
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: command -v markdownlint-cli2 >/dev/null 2>&1
        msg: "markdownlint-cli2 is not installed (see lint:md task for install instructions)"
      - sh: test -f {{.MD_CONFIG}}
        msg: "Markdown lint config not found: {{.MD_CONFIG}}"
    cmds:
      - markdownlint-cli2 --config {{.MD_CONFIG}} --fix "{{.MD_GLOB}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Verify — composition of all verification tasks
  # ═══════════════════════════════════════════════════════════════════════════

  verify:
    desc: Run all verification tasks
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: module:verify
      - task: goversion:verify
      - task: verify:reproducible
      - task: verify:resolution
      - task: verify:cobra
      - task: verify:deps
      - task: verify:two-boundary        # ADDED for WBS 4.2.2
      - task: verify:handler-boundary    # ADDED for WBS 4.3.1

  # ═══════════════════════════════════════════════════════════════════════════
  # Tidy — dependency lockfile maintenance (WBS 2.3.1)
  # ═══════════════════════════════════════════════════════════════════════════

  tidy:
    desc: Run go mod tidy (maintainers only; run on a clean branch)
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: test -z "$(git status --porcelain 2>/dev/null)"
        msg: |
          Working tree is not clean. Commit or stash changes before
          running tidy. See docs/development.md "How go mod tidy
          should be run".
    cmds:
      - go mod tidy
      - |
        set -euo pipefail
        if git diff --quiet -- go.mod go.sum 2>/dev/null; then
          echo "OK: no changes needed (go.mod and go.sum were already tidy)"
        else
          echo "UPDATED: go.mod and/or go.sum changed"
          echo "Review with: git diff go.mod go.sum"
        fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Build — binary compilation with injected metadata (WBS 17.4)
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    desc: Build the Forge binary with injected metadata
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o forge ./cmd/forge
    sources:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    generates:
      - forge

  build:debug:
    desc: Build the Forge binary with debug symbols (no trimpath)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o forge ./cmd/forge

  # ═══════════════════════════════════════════════════════════════════════════
  # Development — tests, formatting, static analysis
  # ═══════════════════════════════════════════════════════════════════════════

  test:
    desc: Run fast unit tests with the race detector
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (compiles and invokes the binary)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go test -race -tags=integration -count=1 ./...

  test:integration:short:
    desc: Run integration tests in short mode (skips slow cases)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go test -race -short -tags=integration -count=1 ./...

  fmt:
    desc: Format all Go source files
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Verify all Go files are formatted (fails if not)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        set -euo pipefail
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "FAIL: unformatted files:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
        echo "OK: all files formatted"

  vet:
    desc: Run go vet across all packages
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - go vet ./...

  # Composed quality gate. Runs cheap checks first, expensive checks last.
  #
  # Order rationale:
  #
  #    1. fmt:check              — instant; formatting drift
  #    2. lint                   — fast; documentation drift
  #    3. vet                    — fast; obvious Go issues
  #    4. goversion:verify       — moderate; toolchain matrix
  #    5. verify:reproducible    — moderate; environment, tidy, and
  #                                negative test
  #    6. verify:cobra           — fast; Cobra pin and wiring
  #    7. verify:deps            — fast; dependency policy
  #    8. verify:two-boundary    — fast; two-boundary model (WBS 4.2.2)
  #    9. verify:handler-boundary — fast; handler / service rule (WBS 4.3.1)
  #   10. test                   — slow; full test suite
  #   11. test:integration       — slowest; process boundary
  check:
    desc: |
      Run the full quality gate
      (format, lint, vet, version matrix, reproducibility, cobra,
       dependency policy, two-boundary model, handler boundary,
       test, integration)
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: fmt:check
      - task: lint
      - task: vet
      - task: goversion:verify
      - task: verify:reproducible
      - task: verify:resolution
      - task: verify:cobra
      - task: verify:deps
      - task: verify:two-boundary
      - task: verify:handler-boundary
      - task: test
      - task: test:integration

  clean:
    desc: Remove build artifacts
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - rm -f forge forge.exe
      - rm -rf dist/