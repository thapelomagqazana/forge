# Forge dependency matrix — machine-readable form.
#
# This file is the authoritative input for the CI lint rule (WBS 14.6.1).
# The human-readable form is docs/architecture/dependency-matrix.md; the two
# are asserted equal by TestMatrixYAMLMatchesMarkdown in internal/arch.
#
# Schema: schemas/dependency-matrix.schema.json
# ADR:    docs/decisions/ADR-042-package-group-dependency-matrix.md
#
# Editing rules:
#   1. Change this file first, then regenerate the Markdown form with
#      `go test ./internal/arch -run TestMatrixYAMLMatchesMarkdown -update`
#      and the golden with
#      `go test ./internal/arch -run TestCanonicalMatrixGolden -update`.
#   2. Any new exception requires a superseding ADR.
#   3. Cycles are forbidden; ParseMatrix rejects a cyclic matrix at load time
#      and TestMatrixAcyclic asserts the invariant on the canonical file.
#   4. Every package under internal/ must appear in exactly one group.
#      TestMatrixGroupsCoverEveryInternalPackage asserts this; a new
#      internal/ package without a group fails the test.

version: 1
schema: schemas/dependency-matrix.schema.json
adr: docs/decisions/ADR-042-package-group-dependency-matrix.md
traceability:
  - FR-ARCH-002
  - NFR-ARCHITECTURE-002

groups:
  # architecture.tooling covers internal/arch, the architecture-guardrail
  # package (ADR-040, ADR-042). It is development tooling, not production
  # code; it is imported only by its own tests and it imports only external
  # packages plus the build-time metadata packages it verifies against
  # (architecture.platform, architecture.release, architecture.distribution).
  #
  # Classified in the Shared layer because it is a cross-cutting tool with
  # no dependencies on any Forge layer. Classifying it as infrastructure
  # would be wrong: every infrastructure package would then be permitted to
  # import it by the layer default, which is the opposite of the intended
  # rule.
  #
  # The dependency from this group to architecture.platform lets the arch
  # tests load the platform matrix as a fixture. The dependency from this
  # group to architecture.release lets the workflow contract test compare
  # .github/workflows/release.yml against the Go model in
  # internal/release. The dependency from this group to
  # architecture.distribution lets the acceptance tests compare the
  # distribution driver's output against the model in
  # internal/distribution. All three edges are one-way: none of
  # architecture.platform, architecture.release, or
  # architecture.distribution may import architecture.tooling, or the
  # build-time tools form a cycle that the matrix rejects by construction
  # (see TestAcyclicAlgorithm, "direct cycle is detected").
  architecture.tooling:
    layer: shared
    packages:
      - internal/arch

  # architecture.platform covers internal/platform, the supported-platform
  # matrix loader (WBS 17.1.1, ADR-040). Like architecture.tooling, it is
  # build-time metadata: it is consumed by cmd/forge-internal-platform, by
  # CI matrix generation, and by release tooling, but never by the
  # user-facing forge binary.
  #
  # Classified in the Shared layer for the same reason as architecture.tooling:
  # it is a cross-cutting tool that depends on no Forge layer. Classifying it
  # as infrastructure would be wrong — every infrastructure package would then
  # be permitted to import it by the layer default, which is the opposite of
  # the intended rule.
  #
  # Production groups are denied import of this group by the closed-world
  # default (TestMatrixDefaultsUnlistedPairsToDeny). That is intentional:
  # runtime code must not read docs/reference/platforms.yaml.
  #
  # The dependencies from this group are absent: architecture.platform
  # imports only external packages (gopkg.in/yaml.v3). The tooling and
  # release groups declare one-way edges to this group; the reverse edges
  # would close cycles and are rejected by the matrix.
  architecture.platform:
    layer: shared
    packages:
      - internal/platform

  # architecture.release covers internal/release, the shared package that
  # owns the artifact-naming convention, the dist/ layout, and the release
  # workflow's job graph (WBS 17.5.2, WBS 17.5.3). Like the other
  # architecture.* groups, it is build-time metadata: it is consumed by
  # cmd/forge-internal-checksums, cmd/forge-internal-sign,
  # cmd/forge-internal-sbom, cmd/forge-internal-distribute, and test/release,
  # but never by the user-facing forge binary.
  #
  # Classified in the Shared layer for the same reason as the other
  # architecture.* groups: it is a cross-cutting tool with no dependencies
  # on any Forge layer. Classifying it as infrastructure would be wrong —
  # every infrastructure package would then be permitted to import it by the
  # layer default, which is the opposite of the intended rule. Classifying
  # it as shared.version would be wrong for the same reason: it is not
  # version metadata, and shared.version is importable by production code
  # (presentation.cli, application, infrastructure.*), which the release
  # naming convention must not be.
  #
  # Production groups are denied import of this group by the closed-world
  # default (TestMatrixDefaultsUnlistedPairsToDeny). That is intentional:
  # a CLI command that printed an archive name would couple the user-facing
  # binary to the release tooling, which is the coupling this group exists
  # to prevent.
  #
  # The dependency from this group to architecture.platform is one-way:
  # internal/release names a platform.Platform to compute an archive's
  # name, but internal/platform must not import internal/release. A mutual
  # pair is a 2-cycle and the matrix rejects it.
  #
  # The dependency from this group to architecture.tooling is absent, and
  # the reverse edge (architecture.tooling -> architecture.release) is the
  # one the tooling's row declares. The absence is what makes the pair
  # acyclic. The same is true of the pair with architecture.distribution:
  # the two are peers, and neither imports the other.
  architecture.release:
    layer: shared
    packages:
      - internal/release

  # architecture.distribution covers internal/distribution, the shared
  # package that renders every distribution channel's manifest from the
  # release's artifacts (WBS 17.5.4). Like the other architecture.*
  # groups, it is build-time metadata: it is consumed by
  # cmd/forge-internal-distribute and by test/distribution, but never
  # by the user-facing forge binary.
  #
  # Classified in the Shared layer for the same reason as the other
  # architecture.* groups: it is a cross-cutting tool with no
  # dependencies on any Forge layer. Classifying it as infrastructure
  # would be wrong — every infrastructure package would then be
  # permitted to import it by the layer default, which is the opposite
  # of the intended rule. Classifying it as shared.version would be
  # wrong for the same reason: it is not version metadata, and
  # shared.version is importable by production code (presentation.cli,
  # application, infrastructure.*), which the distribution tooling
  # must not be.
  #
  # Production groups are denied import of this group by the
  # closed-world default (TestMatrixDefaultsUnlistedPairsToDeny). That
  # is intentional: a CLI command that rendered a Homebrew formula
  # would couple the user-facing binary to the release tooling, which
  # is the coupling this group exists to prevent.
  #
  # internal/distribution names no platform.Platform in production
  # code: the Release struct's Archives map is keyed by the string
  # "goos/goarch", not by the platform type. The group therefore has
  # no outbound edge to architecture.platform. A future change that
  # named the type would add the edge; the current shape has none.
  #
  # The package is a peer of architecture.release: internal/release
  # owns the artifact-naming convention and the workflow's job graph;
  # internal/distribution owns the channel manifests. Neither imports
  # the other. A future change that made one import the other would
  # add the edge; the current shape has none.
  architecture.distribution:
    layer: shared
    packages:
      - internal/distribution

  presentation.cli:
    layer: presentation
    packages:
      - internal/cli

  application:
    layer: application
    packages:
      - internal/application

  # domain is the layer-root placeholder package created by task 14.1.1. It
  # contains only doc.go. It is the parent group of the domain.blueprint,
  # domain.template, domain.component, domain.policy, and domain.foundation
  # subgroups below. Longest-prefix matching in GroupOf ensures a package
  # under one of those subgroups resolves to the subgroup, not to this one.
  domain:
    layer: domain
    packages:
      - internal/domain

  domain.blueprint:
    layer: domain
    packages:
      - internal/domain/blueprint
  domain.template:
    layer: domain
    packages:
      - internal/domain/template
  domain.component:
    layer: domain
    packages:
      - internal/domain/component
  domain.policy:
    layer: domain
    packages:
      - internal/domain/policy
  domain.foundation:
    layer: domain
    packages:
      - internal/domain/foundation

  # infrastructure is the layer-root placeholder package created by task
  # 14.1.1. It contains only doc.go. It is the parent group of the more
  # specific infrastructure subgroups below.
  infrastructure:
    layer: infrastructure
    packages:
      - internal/infrastructure

  infrastructure.filesystem:
    layer: infrastructure
    packages:
      - internal/infrastructure/filesystem
      - internal/filesystem
  infrastructure.config:
    layer: infrastructure
    packages:
      - internal/infrastructure/config
      - internal/config
  infrastructure.renderer:
    layer: infrastructure
    packages:
      - internal/infrastructure/renderer
      - internal/output
  infrastructure.streams:
    layer: infrastructure
    packages:
      - internal/infrastructure/streams
      - internal/streams
  infrastructure.logging:
    layer: infrastructure
    packages:
      - internal/infrastructure/logging
  infrastructure.registry:
    layer: infrastructure
    packages:
      - internal/infrastructure/registry
  infrastructure.git:
    layer: infrastructure
    packages:
      - internal/infrastructure/git

  # shared is the layer-root placeholder package created by task 14.1.1. It
  # contains only doc.go. It is the parent group of the shared.errors,
  # shared.logging, and shared.version subgroups below.
  shared:
    layer: shared
    packages:
      - internal/shared

  shared.errors:
    layer: shared
    packages:
      - internal/shared/errors
      - internal/forgeerr
  shared.logging:
    layer: shared
    packages:
      - internal/shared/logging
      - internal/logger
  shared.version:
    layer: shared
    packages:
      - internal/shared/version
      - internal/version
      - internal/app/version

matrix:
  # architecture.tooling may import architecture.platform so the arch
  # tests can load the platform matrix as a fixture,
  # architecture.release so the workflow contract test can compare the
  # workflow YAML to the Go model, and architecture.distribution so the
  # acceptance tests can compare the distribution driver's output to the
  # model. None of the three edges is mutual: none of the three targets
  # may import architecture.tooling, or the build-time tools form a cycle
  # that the matrix rejects by construction (see TestAcyclicAlgorithm,
  # "direct cycle is detected").
  #
  # No production group may import architecture.tooling; that is enforced
  # by the closed-world default, not by a cell here.
  architecture.tooling:
    architecture.platform: allow
    architecture.release: allow
    architecture.distribution: allow

  # architecture.platform imports only external packages (gopkg.in/yaml.v3).
  # It must not import architecture.tooling, architecture.release, or
  # architecture.distribution: any of the three edges would close a
  # cycle. No production group may import architecture.platform; that is
  # enforced by the closed-world default, not by a cell here.
  architecture.platform: {}

  # architecture.release imports internal/platform for the Platform type
  # that names an artifact's target. It must not import architecture.tooling
  # (the reverse edge is declared in the tooling's row, and a mutual pair
  # is a 2-cycle the matrix rejects). It must not import
  # architecture.distribution: the two packages are peers, and a mutual
  # import would be a cycle. It must not import any production group. No
  # production group may import architecture.release; that is enforced by
  # the closed-world default.
  architecture.release:
    architecture.platform: allow

  # architecture.distribution imports only its own package and the
  # standard library. It does not name internal/platform's Platform type;
  # the Release struct's Archives map is keyed by the string
  # "goos/goarch". It must not import architecture.tooling (the reverse
  # edge is declared in the tooling's row, and a mutual pair is a 2-cycle
  # the matrix rejects). It must not import architecture.release or
  # architecture.platform: the three packages are peers, and a mutual
  # import would be a cycle. It must not import any production group. No
  # production group may import architecture.distribution; that is
  # enforced by the closed-world default.
  architecture.distribution: {}

  presentation.cli:
    application: allow
    domain.blueprint: "condition:C1"
    domain.template: "condition:C1"
    domain.component: "condition:C1"
    domain.policy: "condition:C1"
    domain.foundation: "condition:C1"
    infrastructure.filesystem: "condition:C2"
    infrastructure.config: "condition:C3"
    infrastructure.renderer: "condition:C3"
    infrastructure.streams: "condition:C2"
    infrastructure.logging: "condition:C2"
    infrastructure.registry: "condition:C2"
    infrastructure.git: "condition:C9"
    shared.version: allow

  application:
    domain.blueprint: allow
    domain.template: allow
    domain.component: allow
    domain.policy: allow
    domain.foundation: allow
    shared.version: allow

  # domain is the layer-root placeholder package. It contains only doc.go and
  # is not intended to be imported by any other package. Empty row.
  domain: {}

  # Domain bounded contexts are peers. No context may import another context.
  # If a type must be shared, it is extracted into a shared domain primitive
  # (see ADR-042 §"Cross-context domain imports"). Condition C5 was removed
  # in the same change that emptied these rows, because permitting mutual
  # imports between two contexts is a cycle by construction.
  domain.blueprint: {}
  domain.template: {}
  domain.component: {}
  domain.policy: {}
  domain.foundation: {}

  # infrastructure is the layer-root placeholder package. It contains only
  # doc.go and is not intended to be imported by any other package. Empty row.
  infrastructure: {}

  infrastructure.filesystem:
    domain.blueprint: "condition:C6"
    domain.template: "condition:C6"
    domain.component: "condition:C6"
    domain.policy: "condition:C6"
    domain.foundation: "condition:C6"
    infrastructure.logging: "condition:C6"
    shared.version: allow

  infrastructure.config:
    domain.blueprint: "condition:C6"
    domain.template: "condition:C6"
    domain.component: "condition:C6"
    domain.policy: "condition:C6"
    domain.foundation: "condition:C6"
    infrastructure.filesystem: "condition:C7"
    infrastructure.logging: "condition:C6"
    shared.version: allow

  infrastructure.renderer:
    domain.blueprint: "condition:C6"
    domain.template: "condition:C6"
    domain.component: "condition:C6"
    domain.policy: "condition:C6"
    domain.foundation: "condition:C6"
    infrastructure.streams: "condition:C8"
    infrastructure.logging: "condition:C6"
    shared.version: allow

  infrastructure.streams:
    infrastructure.logging: "condition:C6"
    shared.version: allow

  infrastructure.logging:
    shared.version: allow

  infrastructure.registry:
    domain.blueprint: "condition:C6"
    domain.template: "condition:C6"
    domain.component: "condition:C6"
    domain.policy: "condition:C6"
    domain.foundation: "condition:C6"
    infrastructure.filesystem: "condition:C7"
    infrastructure.config: "condition:C7"
    infrastructure.logging: "condition:C6"
    shared.version: allow

  infrastructure.git:
    domain.foundation: "condition:C6"
    infrastructure.logging: "condition:C6"
    shared.version: allow

  # shared is the layer-root placeholder package. Empty row.
  shared: {}

  shared.errors: {}
  shared.logging: {}
  shared.version: {}

conditions:
  C1:
    summary: "Types-only import from presentation.cli to domain.*"
    rationale: >
      presentation.cli may import a domain package only to name a type that
      appears in an application service's Input/Output or in a returned error.
      It must not call domain functions or construct domain values.
    applies_to:
      - presentation.cli -> domain.blueprint
      - presentation.cli -> domain.template
      - presentation.cli -> domain.component
      - presentation.cli -> domain.policy
      - presentation.cli -> domain.foundation
    enforced_by: review

  C2:
    summary: "Composition-root construction of infrastructure adapters"
    rationale: >
      presentation.cli may import an infrastructure group to construct an
      adapter and inject it into an application service. It must not call
      adapter methods directly.
    applies_to:
      - presentation.cli -> infrastructure.filesystem
      - presentation.cli -> infrastructure.streams
      - presentation.cli -> infrastructure.logging
      - presentation.cli -> infrastructure.registry
    enforced_by: layer

  C3:
    summary: "Composition-root construction of config and renderer"
    rationale: >
      Same as C2, called out separately because config and renderer are the
      two adapter groups the CLI constructs directly today.
    applies_to:
      - presentation.cli -> infrastructure.config
      - presentation.cli -> infrastructure.renderer
    enforced_by: layer

  C4:
    summary: "Domain may name the logger interface only"
    rationale: >
      A domain package may import shared.logging only to name the Logger
      interface it receives as a constructor parameter. It must not construct
      a logger, call slog.*, or reference infrastructure.logging.
    applies_to: []
    enforced_by: review

  # C5 is intentionally absent. It permitted types-only imports between
  # domain bounded contexts, which is a cycle by construction (A -> B and
  # B -> A). Domain contexts are peers and must not import each other; shared
  # types are extracted into a shared domain primitive, which is a separate
  # ADR. See ADR-042 §"Cross-context domain imports".

  C6:
    summary: "Adapter may name the domain types it implements or operates on"
    rationale: >
      An infrastructure adapter may import the domain types it implements
      interfaces for, and the domain types it operates on. It must not call
      domain behavior that is not part of an interface it implements.
    applies_to:
      - infrastructure.filesystem -> domain.blueprint
      - infrastructure.filesystem -> domain.template
      - infrastructure.filesystem -> domain.component
      - infrastructure.filesystem -> domain.policy
      - infrastructure.filesystem -> domain.foundation
      - infrastructure.config -> domain.blueprint
      - infrastructure.config -> domain.template
      - infrastructure.config -> domain.component
      - infrastructure.config -> domain.policy
      - infrastructure.config -> domain.foundation
      - infrastructure.renderer -> domain.blueprint
      - infrastructure.renderer -> domain.template
      - infrastructure.renderer -> domain.component
      - infrastructure.renderer -> domain.policy
      - infrastructure.renderer -> domain.foundation
      - infrastructure.registry -> domain.blueprint
      - infrastructure.registry -> domain.template
      - infrastructure.registry -> domain.component
      - infrastructure.registry -> domain.policy
      - infrastructure.registry -> domain.foundation
      - infrastructure.git -> domain.foundation
    enforced_by: review

  C7:
    summary: "Adapter may use the safe filesystem API"
    rationale: >
      These adapters may import infrastructure.filesystem to read and write
      files through the safe filesystem API. They must not reach into the
      implementation or assume the concrete filesystem is osfs.
    applies_to:
      - infrastructure.config -> infrastructure.filesystem
      - infrastructure.registry -> infrastructure.filesystem
      - infrastructure.registry -> infrastructure.config
    enforced_by: layer

  C8:
    summary: "Renderer writes through the stream wrapper"
    rationale: >
      The renderer may import infrastructure.streams to detect and handle
      broken pipes and to write to the configured output streams.
    applies_to:
      - infrastructure.renderer -> infrastructure.streams
    enforced_by: layer

  C9:
    summary: "Composition-root construction of the git adapter"
    rationale: >
      Same as C2. Called out separately because infrastructure.git is a
      future group.
    applies_to:
      - presentation.cli -> infrastructure.git
    enforced_by: layer

exceptions:
  - group: shared.errors
    applies_to: all
    rationale: >
      Every group must be able to construct and classify errors. See
      ADR-011, ADR-012, ADR-013, ADR-014.
  - group: shared.logging
    applies_to: all
    rationale: >
      Every group must be able to emit diagnostics through the logger
      interface. See ADR-022, ADR-026, ADR-027. Domain groups use it only to
      name the interface (condition C4).